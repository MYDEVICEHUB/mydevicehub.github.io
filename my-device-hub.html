    });
  }
};
/* ============================================================
   FOCUS TIMER — real elapsed time only, never simulated
   ============================================================ */
const Focus = {
  running: false,
  paused: false,
  startedAt: null,      // when the current run began counting
  elapsedBeforePause: 0,
  _tickId: null,

  cfg() { return Store.data.focus.config; },
  targetSeconds() { return Math.max(1, Math.round((this.cfg().minutes || 25) * 60)); },
  elapsed() {
    if (!this.running || !this.startedAt) return this.elapsedBeforePause;
    if (this.paused) return this.elapsedBeforePause;
    return this.elapsedBeforePause + (Date.now() - this.startedAt) / 1000;
  },
  remaining() { return Math.max(0, this.targetSeconds() - this.elapsed()); },
  progress() { return clamp(this.elapsed() / this.targetSeconds(), 0, 1); },

  start() {
    if (this.running) return;
    this.running = true; this.paused = false;
    this.elapsedBeforePause = 0;
    this.startedAt = Date.now();
    Store.log("focus_start", "Started a " + this.cfg().minutes + "-minute focus session.", null);
    UI.toast("Focus started", this.cfg().minutes + " minutes on the clock. Stay with it.", "ok");
    this.ensureGlobalTick();
    UI.refresh();
  },
  pause() {
    if (!this.running || this.paused) return;
    this.elapsedBeforePause = this.elapsed();
    this.paused = true;
    UI.toast("Paused", "Timer paused at " + mmss(this.elapsedBeforePause) + ".", "warn");
    UI.refresh();
  },
  resume() {
    if (!this.running || !this.paused) return;
    this.startedAt = Date.now();
    this.paused = false;
    UI.toast("Resumed", "Picking up where you left off.", "ok");
    UI.refresh();
  },
  stopSilently() {
    this.running = false; this.paused = false; this.startedAt = null; this.elapsedBeforePause = 0;
    if (Store.data.focus.current) { delete Store.data.focus.current; Store.persistSoon(); }
  },
  /* the running session is written down so a reload cannot silently gain time */
  persistLive() {
    if (this.running) {
      Store.data.focus.current = {
        running: true, paused: this.paused, elapsedSec: Math.round(this.elapsed()),
        target: this.targetSeconds(), savedAt: nowIso()
      };
    } else if (Store.data.focus.current) {
      delete Store.data.focus.current;
    }
    Store.persist();
  },

  finish(manual) {
    const secs = Math.round(this.elapsed());
    const target = this.targetSeconds();
    const completed = secs >= target;
    const startedIso = new Date(Date.now() - secs * 1000).toISOString();
    const session = {
      id: uid("ses"), startedAt: startedIso, endedAt: nowIso(), seconds: secs,
      target, completed: !!completed, minutes: this.cfg().minutes,
      manualEnd: !!manual
    };
    Store.addSession(session);
    Store.log(completed ? "focus_complete" : "focus_cancel",
      completed ? "Completed a " + fmtDur(secs / 60) + " focus session (target " + fmtDur(target / 60) + ")."
                : "Ended a focus session early at " + fmtDur(secs / 60) + " of " + fmtDur(target / 60) + " — the real time was still credited.",
      null);
    this.stopSilently();
    if (completed) {
      UI.toast("Session complete", fmtDur(secs / 60) + " of genuine focus time credited.", "ok");
      if (Store.data.settings.notify.focus) UI.notify("Focus session complete", "You finished " + fmtDur(secs / 60) + " of focused work.", true);
    } else {
      UI.toast("Session ended", fmtDur(secs / 60) + " credited — only real elapsed time is ever recorded.", "warn");
    }
    UI.refresh();
  },

  /* the timer keeps running even when you leave the Focus view */
  ensureGlobalTick() {
    if (this._globalId) return;
    this._globalId = setInterval(() => {
      if (!this.running || this.paused) return;
      if (this.elapsed() >= this.targetSeconds()) {
        this.finish(false);
        Store.persist();
      } else {
        if (Router.current === "focus") Focus.paintLive();
        if (Math.round(this.elapsed()) % 15 === 0) this.persistLive();
      }
    }, 1000);
  },
  paintLive() {
    const t = $("#ringTime");
    if (!t) return;
    t.textContent = mmss(this.remaining());
    const lab = $("#ringLabel"); if (lab) lab.textContent = this.paused ? "paused" : "remaining";
    const c = 2 * Math.PI * 96;
    const rc = $("#ringCircle");
    if (rc) rc.setAttribute("stroke-dashoffset", (c * (1 - this.progress())).toFixed(1));
    const pc = $("#ringPct"); if (pc) pc.textContent = Math.round(this.progress() * 100) + "%";
  }
};

          "</div>",
          '<div class="card">',
            cardHead("chart", "Last 7 days"),

        "</div>",

              '<div class="grow"><div class="name">' + fmtDur(x.seconds / 60) + (x.completed ? " · completed" : " · ended early") + '</div>' +
              '<div class="meta">' + esc(fmtDateTime(x.endedAt)) + " · " + esc(relTime(x.endedAt)) + " · target " + (x.target ? fmtDur(x.target / 60) : "—") + "</div></div>" +
              '<div class="wrap" style="justify-content:flex-end">' + (x.completed ? UI.pill("Goal met", "ok", true) : UI.pill("Partial", "warn", true)) + "</div></div>").join("") + "</div>"
          : '<div class="sub">No sessions yet. Every session you finish appears here with its real start and end time.</div>',
      "</div>",

      '<div>' + UI.notice("This timer measures wall-clock time in your browser. Nothing is tracked in the background after you close the page, and a session that is interrupted is saved with the exact seconds that actually elapsed — never rounded up to look better.", "", "clock") + "</div>"

      const a = b.dataset.focus;
      if (a === "start") Focus.start();
      else if (a === "pause") Focus.pause();
      else if (a === "resume") Focus.resume();
      else if (a === "stop") Focus.finish(true);
      else if (a === "discard") {
        UI.confirm({ title: "Discard this session?", message: "The time you have spent will not be recorded at all.", confirmText: "Discard" })
          .then(ok => { if (!ok) return; Focus.stopSilently(); UI.toast("Session discarded", "Nothing was credited.", "warn"); UI.refresh(); });
      }
    }));
    $$("[data-min]", root).forEach(b => b.addEventListener("click", async () => {
      const v = b.dataset.min;
      if (v === "custom") {
        const inp = await UI.prompt({ title: "Custom session length", message: "Enter a length in minutes (1–240).", value: String(Focus.cfg().minutes), placeholder: "e.g. 35" });
        if (inp == null) return;
        const n = clamp(Math.round(Number(inp) || 0), 1, 240);
        Store.data.focus.config.minutes = n;
        Store.persist();
        Store.log("settings_change", "Focus session length set to " + n + " minutes.", null);
        UI.refresh();
      } else {
        Store.data.focus.config.minutes = Number(v);
        Store.persist();
        Store.log("settings_change", "Focus session length set to " + v + " minutes.", null);
        UI.refresh();
      }
    }));
    $$("[data-edit-goal]", root).forEach(b => b.addEventListener("click", async () => {
      const inp = await UI.prompt({ title: "Daily focus goal", message: "How many minutes of focus do you want to average per day?", value: String(Store.data.settings.prefs.dailyFocusGoal || 120), placeholder: "minutes" });
      if (inp == null) return;
      const n = clamp(Math.round(Number(inp) || 0), 5, 720);
      Store.data.settings.prefs.dailyFocusGoal = n;
      Store.persist();
      Store.log("settings_change", "Daily focus goal set to " + n + " minutes.", null);
      UI.toast("Goal updated", "Daily focus goal is now " + n + " minutes.", "ok");
      UI.refresh();
    }));
    UI.every(() => Focus.paintLive(), 1000);
  }
});

const PRIORITIES = [
  { id: "high", label: "High", cls: "p1", weight: 3 },
  { id: "medium", label: "Medium", cls: "p2", weight: 2 },
  { id: "low", label: "Low", cls: "p3", weight: 1 }
];
const prioOf = id => PRIORITIES.find(p => p.id === id) || PRIORITIES[1];

function taskRow(t) {
  const p = prioOf(t.priority);
  const dueDays = t.due ? daysUntil(t.due) : null;
  const overdue = dueDays != null && dueDays < 0 && !t.done;
  const device = t.deviceId ? Store.getDevice(t.deviceId) : null;
  const vehicle = t.vehicleId ? Store.getVehicle(t.vehicleId) : null;
  return '<div class="row" data-task-row="' + esc(t.id) + '">' +
    '<button class="avatar sm" data-toggle-task="' + esc(t.id) + '" aria-label="' + (t.done ? "Mark as pending" : "Mark as complete") + '" style="' + (t.done ? "background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);color:var(--ok)" : "") + '">' + icon(t.done ? "check" : "target", 17) + "</button>" +
    '<div class="grow" data-edit-task="' + esc(t.id) + '" style="cursor:pointer;min-width:0">' +
      '<div class="name" style="' + (t.done ? "text-decoration:line-through;color:var(--muted)" : "") + '">' + esc(t.title) + "</div>" +
      '<div class="meta">' + [
        t.due ? (overdue ? "overdue by " + Math.abs(dueDays) + " days" : dueDays === 0 ? "due today" : "due " + fmtDate(t.due)) : "no due date",
        device ? device.name : null,
        vehicle ? vehicle.nickname : null,
        t.notes ? "has notes" : null
      ].filter(Boolean).map(esc).join(" · ") + "</div>" +
    "</div>" +
    '<div class="wrap" style="justify-content:flex-end">' +
      (overdue ? UI.pill("Overdue", "bad", true) : (t.done ? UI.pill("Completed", "ok", true) : "")) +

      '<button class="icon-btn" style="width:32px;height:32px" data-del-task="' + esc(t.id) + '" aria-label="Delete task">' + icon("trash", 15) + "</button>" +
    "</div></div>";
}

defRoute("tasks", {
  title: "Tasks",
  render(params) {
    const s = Store.data;
    const p = params || {};
    const filter = p.filter || "pending";
    const q = (p.q || "").toLowerCase();
    const sort = p.sort || "smart";

    let list = s.tasks.slice();
    if (filter === "pending") list = list.filter(t => !t.done);
    else if (filter === "completed") list = list.filter(t => t.done);
    else if (filter === "today") list = list.filter(t => t.due === todayKey() || (!t.done && !t.due));
    else if (filter === "overdue") list = list.filter(t => !t.done && t.due && daysUntil(t.due) < 0);
    if (q) list = list.filter(t => (t.title + " " + t.notes).toLowerCase().includes(q));

    const order = { smart: 0, priority: 1, due: 2, created: 3 };
    list.sort((a, b) => {
      if (order[sort] === 1) return prioOf(b.priority).weight - prioOf(a.priority).weight;
      if (order[sort] === 2) return String(a.due || "9999").localeCompare(String(b.due || "9999"));
      if (order[sort] === 3) return new Date(b.createdAt) - new Date(a.createdAt);
      if (a.done !== b.done) return a.done ? 1 : -1;
      return prioOf(b.priority).weight - prioOf(a.priority).weight || String(a.due || "9999").localeCompare(String(b.due || "9999"));
    });

    const todayTasks = s.tasks.filter(t => t.due === todayKey());
    const doneToday = s.tasks.filter(t => t.done && t.completedAt && dayKey(t.completedAt) === todayKey()).length;
    const pending = s.tasks.filter(t => !t.done).length;
    const overdueCount = s.tasks.filter(t => !t.done && t.due && daysUntil(t.due) < 0).length;

    return [
      '<div class="page-head">',
        '<button class="icon-btn" data-back="home" aria-label="Back">' + icon("back", 19) + "</button>",
        "<div><div class=\"eyebrow\">Planner</div><h2>Tasks</h2>" +
        '<p class="sub">Tasks live on this device only. Nothing syncs, nothing is uploaded.</p></div>',
        '<div class="spacer"></div>',
        '<button class="btn btn-primary" data-new-task="1">' + icon("plus", 15) + " Add task</button>",
      "</div>",

      '<div class="grid grid-4" style="margin-bottom:16px">',
        tile("Today's tasks", nfmt(todayTasks.length), todayTasks.length ? "dated today" : "nothing dated today", "accent"),
        tile("Completed", nfmt(doneToday), "finished today"),
        tile("Remaining", nfmt(pending), "still open"),
        tile("Overdue", nfmt(overdueCount), overdueCount ? "needs attention" : "all on track"),
      "</div>",

      '<div class="card flat" style="margin-bottom:16px">',
        '<div class="form-grid">',
          '<div class="field"><label>Quick add</label><input class="input" id="taskQuick" placeholder="Type a task and press Enter"></div>',
          '<div class="field"><label>Priority for quick add</label><div class="seg" id="quickPrio" style="display:flex">' +
            PRIORITIES.slice().reverse().map((x, i) => '<button data-qp="' + x.id + '" class="' + (x.id === "medium" ? "on" : "") + '">' + esc(x.label) + "</button>").join("") + "</div></div>",
        "</div>",
      "</div>",

      '<div class="row-between" style="flex-wrap:wrap;gap:10px;margin-bottom:12px">',
        '<div class="seg">' +
          [["pending", "Pending"], ["today", "Today"], ["overdue", "Overdue"], ["completed", "Completed"], ["all", "All"]]
            .map(o => '<button data-filter="' + o[0] + '" class="' + (filter === o[0] ? "on" : "") + '">' + o[1] + "</button>").join("") +
        "</div>" +
        '<div class="wrap"><input class="input" id="taskSearch" placeholder="Search tasks…" value="' + esc(p.q || "") + '" style="width:180px">' +
        '<select class="select" id="taskSort" style="width:auto"><option value="smart"' + (sort === "smart" ? " selected" : "") + ">Sort: smart</option>" +
        '<option value="priority"' + (sort === "priority" ? " selected" : "") + ">Sort: priority</option>" +
        '<option value="due"' + (sort === "due" ? " selected" : "") + ">Sort: due date</option>" +
        '<option value="created"' + (sort === "created" ? " selected" : "") + ">Sort: newest</option></select></div>",
      "</div>",

      list.length
        ? '<div class="card"><div class="list">' + list.map(taskRow).join("") + "</div></div>"
        : UI.emptyState(
            filter === "completed" ? "Nothing completed yet" : "No tasks here",
            filter === "completed" ? "Tasks you complete get stamped with the exact time and listed here." : "Add a task above, or use the Add task button to include a due date, priority and a linked device.",
            "Add a task", 'data-new-task="1"', "tasks"),
    ].join("");
  },
  afterRender(root) {
    bindDeviceInteractions(root);
    const params = Router.params || {};
    const go = patch => Router.go("tasks", Object.assign({}, params, patch));
    $$("[data-back]", root).forEach(b => b.addEventListener("click", () => Router.go("home")));
    $$("[data-filter]", root).forEach(b => b.addEventListener("click", () => go({ filter: b.dataset.filter })));
    const sortSel = $("#taskSort", root); if (sortSel) sortSel.addEventListener("change", () => go({ sort: sortSel.value }));
    const search = $("#taskSearch", root);
    if (search) { let t; search.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => go({ q: search.value }), 300); }); }
    let quickPrio = "medium";
    $$("[data-qp]", root).forEach(b => b.addEventListener("click", () => {
      quickPrio = b.dataset.qp;
      $$("[data-qp]", root).forEach(x => x.classList.toggle("on", x === b));
    }));
    const quick = $("#taskQuick", root);
    if (quick) quick.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      const v = quick.value.trim();
      if (!v) return;
      Store.addTask({ title: v, priority: quickPrio, due: params.filter === "today" ? todayKey() : "" });
      UI.toast("Task added", "“" + v + "” is on your list.", "ok");
      UI.refresh();
    });
    $$("[data-new-task]", root).forEach(b => b.addEventListener("click", () => openTaskForm(null)));
    $$("[data-toggle-task]", root).forEach(b => b.addEventListener("click", () => {
      const t = Store.getTask(b.dataset.toggleTask); if (!t) return;
      Store.updateTask(t.id, { done: !t.done });
      if (!t.done) UI.toast("Task completed", "“" + t.title + "” is done.", "ok");
      UI.refresh();
    }));
    $$("[data-edit-task]", root).forEach(b => b.addEventListener("click", () => openTaskForm(b.dataset.editTask)));
    $$("[data-del-task]", root).forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      const t = Store.getTask(b.dataset.delTask); if (!t) return;
      UI.confirm({ title: "Delete this task?", message: "“" + t.title + "” will be removed permanently.", confirmText: "Delete task" })
        .then(ok => { if (!ok) return; Store.deleteTask(t.id); UI.toast("Task deleted", "", "ok"); UI.refresh(); });
    }));
  }
});

        };

const MYSTERY_RANKS = [
  { xp: 0,   label: "Curious Bystander" },
  { xp: 150, label: "File Opener" },
  { xp: 400, label: "Evidence Reader" },
  { xp: 700, label: "Case Analyst" },
  { xp: 1000, label: "Chief Investigator" }
];
function mysteryRank(xp) {
  let r = MYSTERY_RANKS[0];
  MYSTERY_RANKS.forEach(x => { if (xp >= x.xp) r = x; });
  const i = MYSTERY_RANKS.indexOf(r);
  const next = MYSTERY_RANKS[i + 1] || null;
  return { current: r, next, progress: next ? pct(xp - r.xp, next.xp - r.xp) : 100 };
}
function mysteryProgress(caseId) {
  const s = Store.data.mystery.progress[caseId];
  return s || { answers: {}, solved: false, xp: 0, revealed: false, startedAt: null };
}

const Mystery = {

    p.answers[key] = optIdx;
    const first = p.answers[key] === optIdx;
    if (optIdx === correctIdx) {
      p.xp = (p.xp || 0) + xpPerItem;
      Store.data.mystery.xp = (Store.data.mystery.xp || 0) + xpPerItem;
      Store.log("mystery_answer", "Correct answer in “" + c.title + "” (+" + xpPerItem + " XP).", { type: "case", id: c.id, name: c.title });

      Store.log("mystery_answer", "Answer submitted in “" + c.title + "” — it was not correct, so no XP was awarded.", { type: "case", id: c.id, name: c.title });
      UI.toast("Not this time", "No XP for that one, but the explanation is shown below.", "warn");
    }
    Store.persist();
    return true;

  reveal(caseId) {
    const c = MYSTERY_CASES.find(x => x.id === caseId);

  close(caseId) {
    const c = MYSTERY_CASES.find(x => x.id === caseId);
    const p = Store.data.mystery.progress[caseId];
    if (!p || p.solved) return;
    const total = c.questions.length + 1;
    const correctCount = c.questions.filter((q, i) => p.answers["q" + i] === q.answer).length + (p.answers.puzzle === c.puzzle.answer ? 1 : 0);
    p.solved = true;
    p.solvedAt = nowIso();
    p.score = Math.round((correctCount / total) * 100);
    const bonus = correctCount === total ? Math.round(c.xp * 0.25) : 0;
    if (bonus) { Store.data.mystery.xp += bonus; p.xp = (p.xp || 0) + bonus; }
    Store.log("mystery_solve", "Closed case " + c.num + " “" + c.title + "” with " + correctCount + "/" + total + " correct" + (bonus ? " (+" + bonus + " XP clean-sweep bonus)" : "") + ".", { type: "case", id: c.id, name: c.title });

    const c = MYSTERY_CASES.find(x => x.id === caseId);

    if (!p) return;
    Store.data.mystery.xp = Math.max(0, (Store.data.mystery.xp || 0) - (p.xp || 0));

    Router.go("mystery");
  }
};

function caseDetail(id) {
  const c = MYSTERY_CASES.find(x => x.id === id);
  if (!c) return UI.emptyState("Case not found", "That file is not in this drawer.", "All cases", 'data-go="mystery"', "mystery");
  const p = mysteryProgress(id);
  const perItem = Math.round(c.xp / (c.questions.length + 1));
  const answeredCount = Object.keys(p.answers || {}).length;
  const total = c.questions.length + 1;
  const allAnswered = answeredCount >= total;

  const qHtml = c.questions.map((q, i) => {
    const key = "q" + i;
    const mine = p.answers[key];
    const answered = mine != null;
    return '<div class="card" style="margin-bottom:12px">' +
      '<div class="row-between" style="margin-bottom:11px"><span class="case-num">Question ' + (i + 1) + " of " + (c.questions.length + 1) + '</span>' +
        (answered ? (mine === q.answer ? UI.pill("Correct +" + perItem + " XP", "ok", true) : UI.pill("Answered", "bad", true)) : UI.pill("Open", "", false)) + "</div>" +
      '<div style="font-size:14.5px;font-weight:600;line-height:1.5">' + esc(q.q) + "</div>" +
      '<div class="stack" style="margin-top:12px">' + q.options.map((o, oi) => {
        let cls = "q-opt";
        if (answered) { if (oi === q.answer) cls += " right"; else if (oi === mine) cls += " wrong"; }
        return '<button class="' + cls + '" data-ans="' + key + '" data-opt="' + oi + '" data-answer="' + q.answer + '"' + (answered ? " disabled" : "") + ">" +
          '<span class="ol">' + String.fromCharCode(65 + oi) + "</span><span>" + esc(o) + "</span></button>";
      }).join("") + "</div>" +
      (answered ? '<div class="notice ' + (mine === q.answer ? "ok" : "warn") + '" style="margin-top:12px"><span class="ni">' + icon(mine === q.answer ? "check" : "warn", 17) + "</span><div><b>" + (mine === q.answer ? "Correct." : "The right answer was " + String.fromCharCode(65 + q.answer) + ".") + "</b> " + esc(q.explain) + "</div></div>" : "") +
      "</div>";
  }).join("");

  const pz = c.puzzle;
  const minePz = p.answers.puzzle;
  const pzAnswered = minePz != null;
  const pzHtml = '<div class="card" style="margin-bottom:12px">' +
    '<div class="row-between" style="margin-bottom:11px"><span class="case-num">Logic puzzle · final question</span>' +
      (pzAnswered ? (minePz === pz.answer ? UI.pill("Correct +" + perItem + " XP", "ok", true) : UI.pill("Answered", "bad", true)) : UI.pill("Open", "", false)) + "</div>" +
    '<div style="font-size:14.5px;font-weight:600">' + esc(pz.prompt) + "</div>" +
    '<div class="sub" style="margin-top:8px">' + esc(pz.detail) + "</div>" +
    '<div class="stack" style="margin-top:12px">' + pz.options.map((o, oi) => {
      let cls = "q-opt";
      if (pzAnswered) { if (oi === pz.answer) cls += " right"; else if (oi === minePz) cls += " wrong"; }
      return '<button class="' + cls + '" data-ans="puzzle" data-opt="' + oi + '" data-answer="' + pz.answer + '"' + (pzAnswered ? " disabled" : "") + ">" +
        '<span class="ol">' + (oi + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("") + "</div>" +
    (pzAnswered ? '<div class="notice ' + (minePz === pz.answer ? "ok" : "warn") + '" style="margin-top:12px"><span class="ni">' + icon(minePz === pz.answer ? "check" : "warn", 17) + "</span><div>" + esc(pz.explain) + "</div></div>" : "") +
    "</div>";

  return [
    '<div class="page-head">',
      '<button class="icon-btn" data-back="mystery" aria-label="Back to cases">' + icon("back", 19) + "</button>",
      '<div><div class="case-num">Case ' + esc(c.num) + " · " + esc(c.difficulty) + "</div><h2>" + esc(c.title) + "</h2>" +
      '<p class="sub">' + esc(c.blurb) + "</p></div>",
    "</div>",

    '<div class="grid grid-4" style="margin-bottom:16px">',
      tile("Reward", c.xp + " XP", perItem + " XP per correct answer", "accent"),
      tile("Answered", answeredCount + "/" + total, allAnswered ? "solution unlocked" : "keep going"),
      tile("Earned here", (p.xp || 0) + " XP", p.solved ? "case closed" : "not closed yet"),
      tile("Status", p.solved ? "Closed" : answeredCount ? "In progress" : "Unsolved", p.solved && p.score != null ? "score " + p.score + "%" : "unscored"),
    "</div>",

    '<div class="two-col" style="margin-bottom:16px">',
      '<div class="card"><div class="card-head"><span class="card-ico">' + icon("mystery", 18) + '</span><span class="t">The story</span></div>' +
        '<div style="font-size:14.3px;line-height:1.65;color:var(--text-2)">' + esc(c.story) + "</div>" +
        '<div class="hr"></div><div class="sub"><b>Scene:</b> ' + esc(c.setting) + "</div>" +
      "</div>",
      '<div class="card"><div class="card-head"><span class="card-ico">' + icon("layers", 18) + '</span><span class="t">Evidence (' + c.evidence.length + ")</span></div>" +
        '<div class="list">' + c.evidence.map(e => '<div class="evidence"><div class="en">' + esc(e.label) + '</div><div class="ed">' + esc(e.detail) + "</div></div>").join("") + "</div>" +
      "</div>",
    "</div>",

    '<div class="card" style="margin-bottom:16px">',
      cardHead("key", "Clues", '<span class="sub">Think first, then check</span>'),
      '<div class="list">' + c.clues.map((cl, i) => {
        const revealed = (p.clues || {})[i];
        return '<div class="row"><span class="avatar xs">' + (revealed ? "💡" : "❔") + '</span><div class="grow" style="min-width:0">' +
          '<div class="sub" style="' + (revealed ? "color:var(--text-2)" : "") + '"' + (revealed ? "" : ' data-blur="1"') + ">" + (revealed ? esc(cl) : "Clue " + (i + 1) + " hidden — reveal it when you are stuck.") + "</div></div>" +
          (revealed ? "" : '<button class="btn btn-sm" data-clue="' + i + '">Reveal</button>') + "</div>";
      }).join("") + "</div>",
      '<div class="hint" style="margin-top:9px">Revealing a clue is free — clues are there to teach you the pattern, not to test you.</div>',
    "</div>",

    '<div class="section-title">Questions</div>',
    qHtml,
    pzHtml,

    '<div class="card" style="margin-top:16px">',
      cardHead("trophy", "The solution", (allAnswered ? '<span class="sub">every question answered</span>' : '<span class="sub">answer all ' + total + " to unlock</span>")),
      (p.revealed || allAnswered
        ? '<div style="font-size:14.3px;line-height:1.7;color:var(--text-2)">' + esc(c.solution) + "</div>" +
          '<div class="hr"></div><div class="notice ok"><span class="ni">' + icon("sparkle", 17) + "</span><div><b>What this case teaches:</b> " + esc(c.lesson) + "</div></div>"
        : '<div class="sub">Finish the questions above and the full solution appears here. You can also reveal it early — but a case closed without answering all questions earns no clean-sweep bonus.</div>' +
          '<div style="margin-top:12px"><button class="btn" data-reveal="1">' + icon("eye", 15) + " Reveal the solution anyway</button></div>"),
    "</div>",

    '<div class="card" style="margin-top:16px">',
      cardHead("check", "Case actions"),
      '<div class="btn-row">',
        '<button class="btn btn-primary" data-close-case="1"' + (p.solved || !allAnswered ? " disabled" : "") + ">" + icon("check", 15) + " " + (p.solved ? "Case closed" : "Close the case &amp; score it") + "</button>",
        '<button class="btn" data-back="mystery">' + icon("back", 15) + " All cases</button>",
        '<button class="btn btn-danger" data-reset-case="1">' + icon("refresh", 15) + " Reset this case</button>",
      "</div>",
      (!allAnswered && !p.solved ? '<div class="hint" style="margin-top:10px">Scoring unlocks once every question has an answer.</div>' : ""),
    "</div>",

    '<div style="margin-top:16px">' + UI.notice("All five cases, their characters and their evidence are original fiction written for this app. They are not real events, and none of this content mixes with your device data.", "", "mystery") + "</div>"
  ].join("");
}

defRoute("case", {
  title: "Case",
  render(params) { return caseDetail(params.id); },
  afterRender(root, params) { bindCaseInteractions(root, params.id); }
});

function bindCaseInteractions(root, id) {
    bindDeviceInteractions(root);
    $$("[data-back]", root).forEach(b => b.addEventListener("click", () => Router.go(b.dataset.back || "mystery")));
    const c = MYSTERY_CASES.find(x => x.id === id);
    const perItem = c ? Math.round(c.xp / (c.questions.length + 1)) : 0;
    $$("[data-ans]", root).forEach(b => b.addEventListener("click", () => {
      Mystery.answer(id, b.dataset.ans, Number(b.dataset.opt), Number(b.dataset.answer), perItem);
      UI.refresh();
    }));
    $$("[data-clue]", root).forEach(b => b.addEventListener("click", () => {
      const p = Store.data.mystery.progress[id] || (Store.data.mystery.progress[id] = { answers: {}, solved: false, xp: 0, revealed: false, startedAt: nowIso() });
      p.clues = p.clues || {};
      p.clues[b.dataset.clue] = true;
      Store.persist();
      UI.refresh();
    }));
    $$("[data-reveal]", root).forEach(b => b.addEventListener("click", () => {
      UI.confirm({ title: "Reveal the solution early?", message: "You can still answer the questions afterwards, but the clean-sweep bonus needs every answer correct.", confirmText: "Reveal", danger: false })
        .then(ok => { if (ok) Mystery.reveal(id); });
    }));
    $$("[data-close-case]", root).forEach(b => b.addEventListener("click", () => Mystery.close(id)));
    $$("[data-reset-case]", root).forEach(b => b.addEventListener("click", () => {
      UI.confirm({ title: "Reset this case?", message: "Your answers, revealed clues and the XP this case earned will be removed. Other cases are untouched.", confirmText: "Reset case" })
        .then(ok => { if (ok) Mystery.resetCase(id); });
    }));
}

defRoute("stats", {
  title: "Stats",
  render() {
    const s = Store.data;
    const focusMin = s.focus.totalSeconds / 60;
    const tasksDone = s.tasks.filter(t => t.done).length;
    const sessions = s.focus.sessions.length;
    const xp = s.mystery.xp;
    const activityCount = s.activity.length;
    const solved = MYSTERY_CASES.filter(c => (s.mystery.progress[c.id] || {}).solved).length;
    const vehCount = s.vehicles.length;
    const cars = Store.vehiclesOfType("car").length;
    const bikes = Store.vehiclesOfType("bike").length;
    const liveIntegrations = s.vehicles.filter(v => ["live", "waiting"].indexOf(vehicleConnState(v).id) > -1).length;
    const serviceEntries = s.vehicles.reduce((a, v) => a + (v.history || []).length, 0);
    const remindersOpen = s.vehicles.reduce((a, v) => a + (v.serviceReminders || []).filter(r => !r.done).length, 0);

    /* focus, last 14 days */
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push({ key: dayKey(d), label: d.toLocaleDateString(undefined, { day: "numeric" }), mins: Math.round(Store.secondsForDay(dayKey(d)) / 60) });
    }
    const maxMins = Math.max(1, ...days.map(d => d.mins));
    const bestDay = days.slice().sort((a, b) => b.mins - a.mins)[0];

    /* tasks, last 7 days */
    const tdays = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = dayKey(d);
      tdays.push({ label: d.toLocaleDateString(undefined, { weekday: "narrow" }), v: s.tasks.filter(t => t.done && t.completedAt && dayKey(t.completedAt) === k).length });
    }

    /* device categories */
    const byCat = {};
    s.devices.forEach(d => { byCat[d.category] = (byCat[d.category] || 0) + 1; });
    const catParts = Object.keys(byCat).map(k => ({ label: catOf(k).label, value: byCat[k], color: "hsl(" + (180 + Object.keys(byCat).indexOf(k) * 34) + " 78% 58%)" }));

    /* activity kinds */
    const kinds = {};
    s.activity.forEach(a => { kinds[a.kind || "other"] = (kinds[a.kind || "other"] || 0) + 1; });
    const kindColors = { add: "#34d399", edit: "#60a5fa", del: "#f87171", live: "#22d3ee", warn: "#fbbf24", "": "#8ea4bd", other: "#8ea4bd" };
    const kindLabels = { add: "Created / completed", edit: "Edited", del: "Deleted / cleared", live: "Real connections", warn: "Warnings", other: "Other" };

    /* storage footprint */
    let bytes = 0, imgBytes = 0;
    try { bytes = (localStorage.getItem(STORE_KEY) || "").length; } catch (e) {}
    s.devices.forEach(d => { if (d.image) imgBytes += d.image.length; });
    if (s.car && s.car.photo) imgBytes += s.car.photo.length;

    const week = days.slice(7).reduce((a, d) => a + d.mins, 0);
    const prevWeek = days.slice(0, 7).reduce((a, d) => a + d.mins, 0);
    const delta = prevWeek ? Math.round(((week - prevWeek) / prevWeek) * 100) : null;

    return [
      '<div class="page-head">',
        '<button class="icon-btn" data-back="home" aria-label="Back">' + icon("back", 19) + "</button>",
        "<div><div class=\"eyebrow\">Your numbers</div><h2>Statistics</h2>" +
        '<p class="sub">Every figure below is computed from things that actually happened in this app. Empty means empty — nothing is padded with placeholders.</p></div>',
      "</div>",

      '<div class="grid grid-4" style="margin-bottom:6px">',
        tile("Total devices", nfmt(s.devices.length), s.devices.filter(d => d.status === "connected").length + " connected right now", "accent", "devices"),
        tile("Total vehicles", nfmt(vehCount), nfmt(cars) + " car" + (cars === 1 ? "" : "s") + " · " + nfmt(bikes) + " bike" + (bikes === 1 ? "" : "s"), "", "car"),
        tile("Live integrations", nfmt(liveIntegrations), liveIntegrations ? "delivering real data" : "none connected", liveIntegrations ? "accent" : "", "plug"),
        tile("Service entries", nfmt(serviceEntries), remindersOpen + " reminder" + (remindersOpen === 1 ? "" : "s") + " open", "", "wrench"),
        tile("Focus time", esc(fmtDur(focusMin)), sessions ? sessions + " session" + (sessions === 1 ? "" : "s") : "no sessions yet", "", "focus"),
        tile("Tasks completed", nfmt(tasksDone), s.tasks.filter(t => !t.done).length + " still open", "", "tasks"),
        tile("Mystery progress", nfmt(xp) + " XP", solved + "/" + MYSTERY_CASES.length + " cases closed", "", "mystery"),
        tile("Activity events", nfmt(activityCount), (bytes / 1024).toFixed(1) + " KB stored locally", "", "clock"),
      "</div>",

      '<div class="grid" style="margin-top:14px">',
        '<div class="card span-2">',
          cardHead("chart", "Focus time · last 14 days", '<span class="chip">peak ' + bestDay.mins + " min</span>"),
          UI.bars(days.map(d => d.label), days.map(d => d.mins), { highlight: 13 }),
          '<div class="bar-labels"><span>13 days ago</span><span>7 days ago</span><span>today</span></div>',
          '<div class="row-between" style="margin-top:12px"><span class="sub">This week vs last week</span>' +
            (delta == null ? '<span class="chip">not enough history</span>' : '<span class="pill ' + (delta >= 0 ? "ok" : "warn") + '"><span class="dot"></span>' + (delta >= 0 ? "+" : "") + delta + "%</span>") + "</div>",
        "</div>",

            const ans = Object.keys(p.answers || {}).length;

            return '<div class="row"><span class="avatar sm">' + (p.solved ? "✅" : "🔍") + '</span><div class="grow" style="min-width:0">' +
              '<div class="name">' + esc(c.num) + " · " + esc(c.title) + '</div><div class="meta">' + (p.solved ? "Closed with score " + (p.score != null ? p.score + "%" : "—") : ans + " of " + tot + " answered") + "</div></div>" +
              '<span class="chip">' + (p.xp || 0) + " XP</span></div>";
          }).join("") + "</div>",
        "</div>",
      "</div>",

      '<div style="margin-top:16px">' + UI.notice(
        "<b>How these numbers are produced.</b> Devices come from your saved profiles. Focus time is the sum of real elapsed seconds. Tasks are counted by their stored completion timestamp. Mystery XP is awarded only by the puzzle engine. Activity counts rows in your own log. " +
        "Where there is not enough history, the chart says “not enough data” rather than drawing an invented trend.",
        "", "chart") + "</div>"
    ].join("");
  },
  afterRender(root) {
    bindDeviceInteractions(root);
    $$("[data-back]", root).forEach(b => b.addEventListener("click", () => Router.go(b.dataset.back || "home")));
  }
});

function applySettings() {
  const s = Store.data.settings;
  const html = document.documentElement;
  html.dataset.accent = s.accent || "cyan";
  html.dataset.bg = s.background === "deep" ? "navy" : (s.background || "navy");
  html.dataset.glow = s.glow === true ? "soft" : (s.glow === false ? "none" : (s.glow || "soft"));
  html.dataset.motion = s.motion ? "on" : "off";
  html.style.setProperty("--fs", String(s.fontScale || 1));
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", (s.background === "graphite" ? "#07090C" : s.background === "midnight" ? "#020306" : "#04060B"));
}

  afterRender(root) {
    const save = (msg) => { Store.persist(); if (msg) UI.toast("Setting saved", msg, "ok"); };

    $$("[data-back]", root).forEach(b => b.addEventListener("click", () => Router.go(Store._lastTab || "home")));

    $$("[data-accent]", root).forEach(b => b.addEventListener("click", () => {
      Store.data.settings.accent = b.dataset.accent;
      applySettings(); save("Accent updated.");
      $$("[data-accent]", root).forEach(x => x.classList.toggle("on", x === b));
      Store.log("settings_change", "Accent colour changed to " + b.dataset.accent + ".", null);
    }));
    $$("[data-bg]", root).forEach(b => b.addEventListener("click", () => {
      Store.data.settings.background = b.dataset.bg; applySettings(); save("Background updated.");
      $$("[data-bg]", root).forEach(x => x.classList.toggle("on", x === b));
    }));
    $$("[data-glow]", root).forEach(b => b.addEventListener("click", () => {
      Store.data.settings.glow = b.dataset.glow; applySettings(); save("Accent lighting updated.");
      $$("[data-glow]", root).forEach(x => x.classList.toggle("on", x === b));
    }));
    $$("[data-fs]", root).forEach(b => b.addEventListener("click", () => {
      Store.data.settings.fontScale = Number(b.dataset.fs); applySettings(); save("Text size updated.");
      $$("[data-fs]", root).forEach(x => x.classList.toggle("on", x === b));
    }));

    const toggles = {
      "motion": () => { Store.data.settings.motion = !Store.data.settings.motion; applySettings(); return Store.data.settings.motion; },
      "reduceEffects": () => { const v = !Store.data.settings.reduceEffects; Store.data.settings.reduceEffects = v; applySettings(); return v; },
      "n-toasts": () => { const n = Store.data.settings.notify; n.toasts = !n.toasts; return n.toasts; },
      "n-focus":  () => { const n = Store.data.settings.notify; n.focus = !n.focus; return n.focus; },
      "n-rem":    () => { const n = Store.data.settings.notify; n.reminders = !n.reminders; return n.reminders; },
      "n-mys":    () => { const n = Store.data.settings.notify; n.mystery = !n.mystery; return n.mystery; },
      "p-saved":  () => { const p = Store.data.settings.prefs; p.showSavedBadge = !p.showSavedBadge; return p.showSavedBadge; },
      "p-confirm":() => { const p = Store.data.settings.prefs; p.confirmDelete = !p.confirmDelete; return p.confirmDelete; },
      "p-snapshot": () => { const p = Store.data.settings.prefs; p.keepLiveSnapshot = !p.keepLiveSnapshot; if (!p.keepLiveSnapshot) Store.data.vehicles.forEach(v => { if (!VehicleLive.anyValue(v.id)) VehicleLive.clear(v.id); }); return p.keepLiveSnapshot; },
      "p-autobt": () => { Store.data.settings.autoScanBluetooth = !Store.data.settings.autoScanBluetooth; return Store.data.settings.autoScanBluetooth; },
      "p-autonet":() => { Store.data.settings.autoScanNetwork = !Store.data.settings.autoScanNetwork; return Store.data.settings.autoScanNetwork; }
    };
    $$("[data-toggle]", root).forEach(b => b.addEventListener("click", () => {
      const fn = toggles[b.dataset.toggle];
      if (!fn) return;
      const v = fn();
      b.classList.toggle("on", !!v);
      b.setAttribute("aria-checked", v ? "true" : "false");
      save(null);
      Store.log("settings_change", "Toggled " + b.dataset.toggle + " to " + (v ? "on" : "off") + ".", null);
    }));

    const dc = $("#setDefaultConn", root); if (dc) dc.addEventListener("change", () => { Store.data.settings.prefs.defaultConn = dc.value; save("Default connection type set to " + connLabel(dc.value) + "."); });
    $$("[data-default-veh]", root).forEach(b => b.addEventListener("click", () => {
      Store.data.settings.prefs.defaultVehicleType = b.dataset.defaultVeh; save("New vehicles will default to " + vehType(b.dataset.defaultVeh).label + ".");
      $$("[data-default-veh]", root).forEach(x => x.classList.toggle("on", x === b));
    }));
    $$("[data-poll]", root).forEach(b => b.addEventListener("click", () => {
      Store.data.settings.prefs.livePollSeconds = Number(b.dataset.poll); save("Vehicle polling interval set to " + b.dataset.poll + " s.");
      $$("[data-poll]", root).forEach(x => x.classList.toggle("on", x === b));
    }));
    const ik = $("#setImgKb", root); if (ik) ik.addEventListener("change", () => { Store.data.settings.prefs.imageMaxKb = Number(ik.value); save("Image limit set to " + ik.value + " KB."); });

    $$("[data-notif-ask]", root).forEach(b => b.addEventListener("click", async () => {
      try {
        const res = await Notification.requestPermission();
        UI.toast(res === "granted" ? "Notifications allowed" : "Notifications not allowed", res === "granted" ? "Focus and reminder alerts can now reach you." : "The app will keep using in-app toasts instead.", res === "granted" ? "ok" : "warn");
        UI.refresh();
      } catch (e) { UI.toast("Could not request permission", "The browser refused the request.", "bad"); }
    }));

    $$("[data-perm-refresh]", root).forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; b.innerHTML = icon("refresh", 14) + " Checking…";
      await refreshPermissions();
      UI.toast("Permissions refreshed", "States are read directly from the browser.", "ok");
      UI.refresh();
    }));

    /* ---- DATA ---- */
    $$("[data-export]", root).forEach(b => b.addEventListener("click", () => exportData(false)));
    $$("[data-copy-backup]", root).forEach(b => b.addEventListener("click", () => exportData(true)));
    $$("[data-import]", root).forEach(b => b.addEventListener("click", importFlow));
    $$("[data-clear-all]", root).forEach(b => b.addEventListener("click", clearAllFlow));
    $$("[data-clear-activity]", root).forEach(b => b.addEventListener("click", () => {
      UI.confirm({ title: "Clear the activity log?", message: "All " + Store.data.activity.length + " logged events will be removed. Everything else stays.", confirmText: "Clear log" })
        .then(ok => { if (!ok) return; const n = Store.data.activity.length; Store.data.activity = []; Store.persist(); UI.toast("Activity log cleared", n + " events removed. The clearing itself is not logged.", "ok"); UI.refresh(); });
    }));

/* ---------------- export / import / clear ---------------- */
function buildExport() {
  const s = Store.data;
  return {
    app: "My Device Hub",
    kind: "mydevicehub.backup",
    schema: s.version || 1,
    exportedAt: nowIso(),
    counts: {
      devices: s.devices.length, vehicles: s.vehicles.length,
      tasks: s.tasks.length, activity: s.activity.length,
      sessions: s.focus.sessions.length, cases: Object.keys(s.mystery.progress || {}).length
    },
    settings: s.settings,
    devices: s.devices,
    vehicles: s.vehicles,
    primaryVehicleId: s.primaryVehicleId,
    tasks: s.tasks,
    focus: s.focus,
    mystery: s.mystery,
    activity: s.activity,
    meta: s.meta
  };
}
function exportData(toClipboard) {
  const payload = JSON.stringify(buildExport(), null, 2);
  const kb = (payload.length / 1024).toFixed(1) + " KB";
  if (toClipboard) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload)
        .then(() => { Store.data.meta.lastBackupAt = nowIso(); Store.persist(); UI.toast("Backup copied", kb + " of JSON is on your clipboard. Paste it somewhere safe.", "ok"); UI.refresh(); })
        .catch(() => showBackupModal(payload, kb, "Clipboard access was blocked by the browser."));
    } else showBackupModal(payload, kb, "This browser did not expose the clipboard API.");
    return;
  }
  showBackupModal(payload, kb, null);
}
function showBackupModal(payload, kb, note) {
  UI.modal({
    wide: true,
    body: [
      '<div class="sheet-head"><div><h3>Your backup</h3><div class="sub">' + kb + " of JSON containing " + esc(Store.data.devices.length + " device(s), " + Store.data.vehicles.length + " vehicle(s), " + Store.data.tasks.length + " task(s) and all your progress.") +
      (note ? " <b>" + esc(note) + "</b>" : "") + "</div></div></div>",
      '<div class="field"><label>Backup JSON</label><textarea class="textarea mono" id="backupText" readonly style="min-height:190px;font-size:11.5px">' + esc(payload) + "</textarea></div>",
      '<div class="sheet-foot">',
        '<button class="btn btn-primary" data-dl="1">' + icon("download", 15) + " Download .json file</button>",
        '<button class="btn" data-copy2="1">' + icon("file", 15) + " Copy to clipboard</button>",
        '<button class="btn btn-ghost" data-close>Close</button>',
      "</div>",
      '<div class="hint" style="margin-top:12px">If the download is blocked (some in-app browsers and sandboxed frames disallow it), copy the JSON from the box above — it is the same data.</div>'
    ].join(""),
    onMount(sheet, close) {
      $$("[data-dl]", sheet).forEach(b => b.addEventListener("click", () => {
        try {
          const blob = new Blob([payload], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "my-device-hub-backup-" + dayKey() + ".json";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          Store.data.meta.lastBackupAt = nowIso();
          Store.persist();
          Store.log("data_import", "A backup file was exported (" + kb + ").", null);
          UI.toast("Download started", "Keep this file somewhere safe.", "ok");
          UI.refresh();
        } catch (e) {
          UI.toast("Download blocked", "Copy the JSON from the box instead — it is identical.", "warn");
        }
      }));
      $$("[data-copy2]", sheet).forEach(b => b.addEventListener("click", () => {
        const ta = $("#backupText", sheet);
        ta.removeAttribute("readonly"); ta.select(); ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        ta.setAttribute("readonly", "readonly");
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(payload).then(() => {}).catch(() => {});
        UI.toast(ok ? "Copied" : "Select manually", ok ? "Backup JSON is on your clipboard." : "Your browser blocked scripted copy — the text is selected, press Ctrl/Cmd+C.", ok ? "ok" : "warn");
        Store.data.meta.lastBackupAt = nowIso(); Store.persist();
      }));
    }
  });
}

function importFlow() {
  UI.modal({
    body: [
      '<div class="sheet-head"><div><h3>Import a backup</h3><div class="sub">The file is validated before anything is changed. You choose how it is applied.</div></div></div>',

      '<div class="field"><label>…or paste the backup JSON directly</label><textarea class="textarea mono" id="importText" placeholder="{ &quot;app&quot;: &quot;My Device Hub&quot; … }" style="min-height:140px;font-size:11.5px"></textarea></div>',
      '<div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn" data-import-text="1">Validate &amp; continue</button></div>',

    ].join(""),

          const rd = new FileReader();

      }));

}

function handleImportPayload(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { UI.toast("Not valid JSON", "The file could not be parsed, so nothing was changed.", "bad"); return; }
  if (!parsed || parsed.app !== "My Device Hub" || !parsed.kind) {
    UI.toast("Unrecognised backup", "This file was not produced by My Device Hub. Nothing was changed.", "bad");
    return;
  }
  const c = parsed.counts || {};
  UI.modal({
    body: [
      '<div class="sheet-head"><div><h3>Backup verified</h3><div class="sub">Exported ' + esc(parsed.exportedAt ? fmtDateTime(parsed.exportedAt) : "at an unknown time") + ". Nothing has been changed yet.</div></div></div>",
      '<div class="grid grid-4" style="gap:10px">' +
        tile("Devices", nfmt(c.devices || (parsed.devices || []).length), "in the file") +
        tile("Vehicles", nfmt(c.vehicles || (parsed.vehicles || []).length), "in the file") +
        tile("Tasks", nfmt(c.tasks || (parsed.tasks || []).length), "in the file") +
        tile("Activity rows", nfmt(c.activity || (parsed.activity || []).length), "in the file") +
      "</div>",
      '<div class="hr"></div>',
      '<div class="list">' +
        '<div class="row"><span class="avatar sm">' + icon("layers", 17) + '</span><div class="grow"><div class="name">Merge with my current data</div><div class="meta">Keeps everything you have now and adds the file\'s devices, vehicles, tasks and sessions alongside it. Duplicate ids are skipped, so no vehicle is ever overwritten.</div></div><button class="btn btn-sm" data-mode="merge">Merge</button></div>' +
        '<div class="row"><span class="avatar sm" style="color:var(--bad);border-color:rgba(241,106,106,.35)">' + icon("warn", 17) + '</span><div class="grow"><div class="name">Replace everything</div><div class="meta">Your current devices, vehicles, tasks, focus history, mystery progress and settings are discarded and replaced by the file\'s contents.</div></div><button class="btn btn-sm btn-danger" data-mode="replace">Replace</button></div>' +
      "</div>",
      '<div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button></div>'
    ].join(""),
    onMount(sheet, close) {
      $$("[data-mode]", sheet).forEach(b => b.addEventListener("click", () => {
        const mode = b.dataset.mode;
        close();
        UI.confirm({
          title: mode === "replace" ? "Replace all current data?" : "Merge this backup in?",
          message: mode === "replace"
            ? "Everything currently in the hub will be deleted and replaced with the contents of this file. This cannot be undone."
            : "The file's devices, tasks, car profile and sessions will be added to what you already have. Matching ids are skipped rather than duplicated.",
          confirmText: mode === "replace" ? "Replace everything" : "Merge backup",
          danger: mode === "replace"
        }).then(ok => { if (ok) applyImport(parsed, mode); });
      }));
    }
  });
}

function applyImport(parsed, mode) {
  const before = { devices: Store.data.devices.length, vehicles: Store.data.vehicles.length, tasks: Store.data.tasks.length, sessions: Store.data.focus.sessions.length };
  if (mode === "replace") {
    if (!parsed.vehicles && parsed.car) { parsed.vehicles = null; }   /* let migrate() lift a v1 backup forward */
    Store.data = Store.migrate(parsed);
    Store.data.meta.lastImportAt = nowIso();
    Store.data.activity.unshift({ id: uid("act"), ts: nowIso(), action: "data_import", label: ACTIVITY_ACTIONS.data_import.l, detail: "Backup applied in replace mode: " + before.devices + " device(s) replaced.", kind: "add", entity: null });
    Store.persist();
    UI.toast("Backup restored", "Your hub now matches the backup exactly.", "ok");
  } else {
    let added = 0, skipped = 0;
    (parsed.devices || []).forEach(d => {
      if (!d || !d.id || Store.getDevice(d.id)) { skipped++; return; }
      Store.data.devices.push(d); added++;
    });
    (parsed.vehicles || []).forEach(v => {
      if (!v || !v.id || Store.getVehicle(v.id)) { skipped++; return; }
      Store.data.vehicles.push(Store.normalizeVehicle(v)); added++;
    });
    (parsed.tasks || []).forEach(t => {
      if (!t || !t.id || Store.data.tasks.some(x => x.id === t.id)) { skipped++; return; }
      Store.data.tasks.push(t); added++;
    });
    const known = new Set(Store.data.focus.sessions.map(s => s.id));
    (parsed.focus && parsed.focus.sessions || []).forEach(s => {
      if (!s || !s.id || known.has(s.id)) { skipped++; return; }
      Store.data.focus.sessions.push(s);
      Store.data.focus.totalSeconds += (s.seconds || 0);
      added++;
    });
    Object.keys((parsed.mystery || {}).progress || {}).forEach(cid => {
      if (!Store.data.mystery.progress[cid]) {
        Store.data.mystery.progress[cid] = parsed.mystery.progress[cid];
        Store.data.mystery.xp += (parsed.mystery.progress[cid].xp || 0);
        added++;
      } else skipped++;
    });
    if (!Store.data.primaryVehicleId && parsed.primaryVehicleId && Store.getVehicle(parsed.primaryVehicleId)) {
      Store.data.primaryVehicleId = parsed.primaryVehicleId;
    }
    Store.data.devices.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    Store.data.vehicles.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    Store.data.meta.lastImportAt = nowIso();
    Store.persist();
    Store.log("data_import", "Merged a backup: " + added + " record(s) added, " + skipped + " skipped as duplicates.", null);
    UI.toast("Backup merged", added + " record(s) added, " + skipped + " skipped.", "ok");
  }
  applySettings();
  Router.go("home");
  UI.refresh();
}

/* ============================================================
   NOTIFICATIONS (browser-level, opt-in only)
   ============================================================ */
UI.notify = function (title, body, silent) {
  try {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return false;
    const n = new Notification(title, { body: body || "", tag: "mydevicehub-" + title, silent: !!silent });
    setTimeout(() => { try { n.close(); } catch (e) {} }, 12000);
    return true;
  } catch (e) { return false; }
};

async function refreshPermissions() {
  try { Perm.cache = await Perm.queryAll(); }
  catch (e) { Perm.cache = [{ key: "api", label: "Permissions API", why: "Query failed.", state: "unsupported" }]; }
  return Perm.cache;
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  /* 1. load persisted state */
  Store.load();
  applySettings();

  /* 2. safety net for old / partial backups */
  if (Store.data.version == null) Store.data.version = 1;
  Store.data.meta.lastOpenAt = nowIso();

  /* 2b. native bridge receiver — installed so a real wrapper can push data */
  NativeBridge.installReceiver();

  /* 2c. tell the user once if their data was upgraded from v1 */
  if (Store.data.meta.migratedFrom === "v1" && !Store.data.meta.upgradeNoticeShown) {
    Store.data.meta.upgradeNoticeShown = true;
    Store.persist();
    setTimeout(() => UI.toast("Upgraded to My Device Hub v2",
      "Your car profile became your first vehicle" + (Store.data.vehicles.length > 1 ? " (alongside " + (Store.data.vehicles.length - 1) + " other vehicle profile(s))" : "") +
      ", and device categories were updated. Nothing was deleted.", "ok"), 1400);
  }

  /* 3. storage banner if localStorage is unavailable */
  if (!Store.available) {
    $("#storageBanner").innerHTML = UI.notice(
      "<b>Storage unavailable.</b> This browser blocked local storage, so nothing you create will survive a reload. You can still explore the app; use Export in settings to copy your data out as JSON.",
      "warn", "warn");
  } else if (Store.externalConflict) {
    $("#storageBanner").innerHTML = UI.notice("<b>Could not save.</b> The browser refused a write — likely a full or restricted storage quota. Free space or export a backup.", "bad", "warn");
  }

  /* 4. restore an unfinished focus session, honestly */
  const live = Store.data.focus.current;
  if (live && live.running) {
    const restored = clamp(Number(live.elapsedSec) || 0, 0, 24 * 3600);
    Focus.running = true;
    Focus.paused = true;
    Focus.elapsedBeforePause = restored;
    Focus.startedAt = null;
    UI.toast("Focus session restored", "A session was running when the page last closed. It is paused at " + mmss(restored) + " and only that real time is saved. Resume or finish it from the Focus tab.", "warn");
  }

  /* 5. platform capabilities */
  const s = Store.data.settings;
  if (s.autoScanBluetooth) {
    BT.probe();
  } else {
    // still report API presence honestly, without asking the adapter anything
    if (!navigator.bluetooth) { BT.state = "unsupported"; BT.reason = Platform.ua.ios ? "Safari and every iOS browser do not expose the Web Bluetooth API." : "This browser does not expose the Web Bluetooth API."; }
    else if (!Platform.secure) { BT.state = "insecure"; BT.reason = "Web Bluetooth only works on a secure HTTPS origin (or localhost)."; }
    else { BT.state = "supported"; BT.reason = "Availability check at launch is switched off in settings, so the adapter has not been queried yet."; }
  }
  Net.init(!!s.autoScanNetwork);
  if (s.autoScanNetwork) {
    window.addEventListener("online", () => Net.onOnline());
    window.addEventListener("offline", () => Net.onOffline());
  }
  refreshPermissions().then(() => { if (Router.current === "settings") UI.refresh(); });

  /* 6. wire global inputs */
  const imgInput = $("#imgPicker");
  if (imgInput) imgInput.addEventListener("change", e => UI.handleImageFile(e.target.files && e.target.files[0]));

  /* 7. global safety + persistence hooks */
  window.addEventListener("beforeunload", () => {
    Focus.persistLive();
    Store.persist();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { Focus.persistLive(); Store.persist(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && UI.modalStack.length) {
      const top = UI.modalStack[UI.modalStack.length - 1];
      if (top.close) top.close();
    }
  });
  /* a single delegated handler for links: never load an unverified URL */
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[data-ext]");
    if (!a) return;
    e.preventDefault();
    const url = safeUrl(a.getAttribute("href"));
    if (!url) {
      UI.toast("Link blocked", "That address failed the safety check and was not opened.", "bad");
      Store.log("security_notice", "Blocked a link that failed URL validation.", null);
      return;
    }
    window.open(url, "_blank", "noopener,noreferrer");
  });

  /* 8. global timers */
  Focus.ensureGlobalTick();

  /* vehicle reminder check — only while the app is open, and only for dates you entered */
  const seenReminders = {};
  setInterval(() => {
    if (!Store.data.settings.notify.reminders) return;
    Store.data.vehicles.forEach(v => {
      const next = nextVehicleReminder(v);
      if (!next || next.days > 3 || next.days < 0) return;
      const key = v.id + ":" + next.label + ":" + dayKey();
      if (seenReminders[key]) return;
      seenReminders[key] = true;
      UI.toast("Vehicle reminder", v.nickname + " · " + next.label + " — " + next.when + ".", "warn");
      UI.notify("Vehicle reminder", v.nickname + ": " + next.label + " is " + next.when + ".", true);
      Store.log("service_due", "Reminder surfaced for “" + v.nickname + "”: " + next.label + " (" + next.when + ").", { type: "vehicle", id: v.id, name: v.nickname });
    });
  }, 60000);

  /* live snapshots survive a reload only as clearly-timestamped last readings */
  if (Store.data.settings.prefs.keepLiveSnapshot === false) {
    Store.data.vehicles.forEach(v => { if (v.live) delete v.live; });
    Store.persist();
  }

  /* a calm heartbeat that keeps time-based labels honest without re-rendering constantly */
  setInterval(() => {
    if (Router.current === "home") {
      const d = $("#heroDate");
      if (d) d.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }
  }, 30000);

  /* 9. first paint */
  UI.syncNav();
  Router.go("home");
  UI.syncFooter();

  /* 10. gentle first-run guidance, shown once per install */
  if (Store.data.devices.length === 0 && !Store.data.meta.seenIntro) {
    Store.data.meta.seenIntro = true;
    Store.persist();
    setTimeout(() => {
      UI.modal({
        body: [
          '<div class="sheet-head"><div><h3>Welcome to My Device Hub</h3><div class="sub">Your personal device and vehicle command center. Here is exactly what it will and will not do.</div></div></div>',
          '<div class="list">' +
            '<div class="row" style="align-items:flex-start"><span class="avatar sm" style="color:var(--ok);border-color:rgba(52,211,153,.35)">' + icon("check", 17) + '</span><div class="grow"><div class="name">Real data only</div><div class="meta" style="white-space:normal;line-height:1.55">Bluetooth and network information comes from the browser\'s own APIs. If something cannot be read, the app says so plainly.</div></div></div>' +
            '<div class="row" style="align-items:flex-start"><span class="avatar sm">' + icon("shield", 17) + '</span><div class="grow"><div class="name">Nothing is uploaded</div><div class="meta" style="white-space:normal;line-height:1.55">There is no account and no server. Everything you create lives in this browser\'s local storage.</div></div></div>' +
            '<div class="row" style="align-items:flex-start"><span class="avatar sm">' + icon("devices", 17) + '</span><div class="grow"><div class="name">Saved is not connected</div><div class="meta" style="white-space:normal;line-height:1.55">Adding a device just records it. A profile shows “Saved profile” until you genuinely connect to something real.</div></div></div>' +
            '<div class="row" style="align-items:flex-start"><span class="avatar sm">' + icon("car", 17) + '</span><div class="grow"><div class="name">Vehicles: unlimited cars and bikes</div><div class="meta" style="white-space:normal;line-height:1.55">Each vehicle has its own profile, reminders and service history. Live speed, fuel, temperature and the rest appear <b>only</b> through a really connected integration — OBD-II, your own telemetry endpoint or a native bridge.</div></div></div>' +
            '<div class="row" style="align-items:flex-start"><span class="avatar sm" style="color:var(--warn);border-color:rgba(231,179,70,.35)">' + icon("warn", 17) + '</span><div class="grow"><div class="name">What this can never see</div><div class="meta" style="white-space:normal;line-height:1.55">Other apps\' Bluetooth activity, Wi-Fi names, IP addresses, signal strength, and any vehicle data without a connected integration. Those stay off-limits — and are never faked here.</div></div></div>' +
          "</div>",
          '<div class="sheet-foot"><button class="btn btn-primary btn-block" data-close>' + icon("check", 15) + " Get started</button></div>",
        ].join(""),
        onMount(sheet, close) {
          const go = $(".sheet-foot .btn", sheet);
          if (go) go.addEventListener("click", () => { UI.toast("Ready", "Tap + ADD DEVICE whenever you are.", "ok"); });
        }
      });
    }, 700);
  }

  console.info("[My Device Hub] v2 booted. Bluetooth:", BT.state, "· Network API:", Net.supported, "· Storage:", Store.available,
    "· Devices:", Store.data.devices.length, "· Vehicles:", Store.data.vehicles.length, "· Vehicle sources:", JSON.stringify(Caps.summary()));
})();
</script>
</body>
</html>
