  { id: "mystery",   label: "Mystery",   icon: "mystery" },
  { id: "stats",     label: "Stats",     icon: "stats" }
];
const ROUTES = {};
function defRoute(name, def) {
  ROUTES[name] = Object.assign({ title: "My Device Hub", render: () => UI.emptyState("No view", "This section is not available.") }, def);
}
const Router = {
  current: "home",
  params: {},
  go(name, params, opts) {
    if (typeof name === "object" && name) { params = name.params || {}; opts = opts || {}; name = name.name || "home"; }
    if (!ROUTES[name]) name = "home";
    if (name !== "settings" && TABS.some(t => t.id === name)) Store._lastTab = name;
    this.current = name;
    this.params = params || {};
    if (!params || params.__keepScroll !== true) {
      // reset scroll on primary navigation only
    }
    UI.render();
    if (!(opts && opts.keepScroll)) window.scrollTo({ top: 0, behavior: Store.data.settings.motion ? "smooth" : "auto" });
    UI.syncNav();
    if (ROUTES[name].onEnter) ROUTES[name].onEnter(this.params);
  }
};

/* ============================================================
   UI CORE (toast, modal, render engine)
   ============================================================ */
const UI = {
  modalStack: [],
  _imgCb: null,

  toast(title, msg, kind) {
    if (!Store.data.settings.notify.toasts && kind !== "bad") return;
    const root = $("#toastRoot");
    const el = document.createElement("div");
    el.className = "toast " + (kind || "");
    const ic = kind === "ok" ? "check" : kind === "bad" ? "alert" : kind === "warn" ? "warn" : "info";
    el.innerHTML =
      '<span class="ti">' + icon(ic, 19) + "</span>" +
      '<div class="tx"><div class="tt">' + esc(title) + "</div>" + (msg ? '<div class="ts2">' + esc(msg) + "</div>" : "") + "</div>" +
      '<button class="tclose" aria-label="Dismiss">' + icon("close", 16) + "</button>";
    $(".tclose", el).addEventListener("click", () => remove());
    root.appendChild(el);
    let gone = false;
    function remove() {
      if (gone) return; gone = true;
      el.classList.add("out");
      setTimeout(() => el.remove(), 240);
    }
    setTimeout(remove, kind === "bad" ? 7000 : 4200);
  },

  modal(opts) {
    const wrap = document.createElement("div");
    wrap.className = "backdrop";
    const sheet = document.createElement("div");
    sheet.className = "sheet" + (opts.wide ? " wide" : "");
    sheet.setAttribute("role", "dialog");
    sheet.setAttribute("aria-modal", "true");
    sheet.innerHTML = '<div class="grabber"></div>' + (opts.body || "");
    wrap.appendChild(sheet);
    const prevFocus = document.activeElement;
    const entry = { wrap, sheet, onClose: opts.onClose };
    this.modalStack.push(entry);
    $("#modalRoot").appendChild(wrap);
    document.body.style.overflow = "hidden";

    function close() {
      const i = UI.modalStack.indexOf(entry);
      if (i > -1) UI.modalStack.splice(i, 1);
      wrap.remove();
      if (!UI.modalStack.length) document.body.style.overflow = "";
      if (opts.onClose) opts.onClose();
      if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) {}
    }
    entry.close = close;
    wrap.addEventListener("mousedown", e => { if (e.target === wrap && opts.dismissable !== false) close(); });
    $$("[data-close]", sheet).forEach(b => b.addEventListener("click", close));
    if (opts.onMount) opts.onMount(sheet, close);
    setTimeout(() => {
      const f = sheet.querySelector("input:not([type=hidden]),select,textarea,button");
      if (f && !("ontouchstart" in window)) f.focus();
    }, 120);
    return close;
  },

  confirm(opts) {
    return new Promise(resolve => {
      let answered = false;
      const danger = opts.danger !== false;
      const body =
        '<div class="sheet-head"><div class="card-ico ' + (danger ? "" : "") + '" style="' + (danger ? "color:var(--bad);background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3)" : "") + '">' + icon(danger ? "warn" : "info", 19) + "</div>" +
        "<div><h3>" + esc(opts.title || "Are you sure?") + "</h3>" +
        '<div class="sub">' + (opts.html || esc(opts.message || "")) + "</div></div></div>" +
        '<div class="sheet-foot">' +
        '<button class="btn btn-ghost" data-close>' + esc(opts.cancelText || "Cancel") + "</button>" +
        '<button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" data-yes>' + esc(opts.confirmText || "Confirm") + "</button></div>";
      const close = UI.modal({
        body,
        onMount(sheet, done) {
          $("[data-yes]", sheet).addEventListener("click", () => { answered = true; resolve(true); done(); });
        },
        onClose: () => { if (!answered) resolve(false); }
      });
      return close;
    });
  },

  prompt(opts) {
    return new Promise(resolve => {
      const body =
        '<div class="sheet-head"><div><h3>' + esc(opts.title || "Enter a value") + "</h3>" +
        (opts.message ? '<div class="sub">' + esc(opts.message) + "</div>" : "") + "</div></div>" +
        '<div class="field"><label>Value</label><input class="input" id="promptInput" value="' + esc(opts.value || "") + '" placeholder="' + esc(opts.placeholder || "") + '"></div>' +
        '<div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-ok>OK</button></div>';
      let closed = false;
      UI.modal({
        body,
        onMount(sheet, done) {
          const inp = $("#promptInput", sheet);
          const ok = () => { closed = true; const v = inp.value; done(); resolve(v); };
          $("[data-ok]", sheet).addEventListener("click", ok);
          inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
          setTimeout(() => inp.focus(), 100);
        },
        onClose: () => { if (!closed) resolve(null); }
      });
    });
  },

  emptyState(title, msg, btnLabel, btnAttr, iconName) {
    return '<div class="empty"><div class="ei">' + icon(iconName || "box", 24) + "</div><h4>" + esc(title) + "</h4>" +
      (msg ? "<p>" + msg + "</p>" : "") +
      (btnLabel ? '<button class="btn btn-primary btn-sm" ' + (btnAttr || "") + ">" + icon("plus", 15) + " " + esc(btnLabel) + "</button>" : "") + "</div>";
  },
  notice(html, kind, iconName) {
    return '<div class="notice ' + (kind || "") + '"><span class="ni">' + icon(iconName || (kind === "warn" ? "warn" : kind === "ok" ? "check" : "info"), 18) + "</span><div>" + html + "</div></div>";
  },
  pill(text, kind, dot, live) {
    return '<span class="pill ' + (kind || "") + (live ? " live" : "") + '">' + (dot !== false ? '<span class="dot"></span>' : "") + esc(text) + "</span>";
  },
  kv(k, v, mono) {
    return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v' + (mono === false ? " plain" : "") + '">' + v + "</span></div>";
  },
  avatarHtml(item, size) {
    const cls = "avatar" + (size ? " " + size : "");
    const img = safeImg(item && item.image);
    if (img) return '<div class="' + cls + '"><img src="' + esc(img) + '" alt=""></div>';
    const cat = catOf(item && item.category);
    return '<div class="' + cls + '">' + (cat.emoji || "📦") + "</div>";
  },

  /* ---- image picker (downscales to keep storage small) ---- */
  pickImage(cb) {
    const input = $("#imgPicker");
    this._imgCb = cb;
    input.value = "";
    input.click();
  },
  handleImageFile(file) {
    const cb = this._imgCb; this._imgCb = null;
    if (!file) return;
    if (!/^image\//.test(file.type)) { this.toast("Unsupported file", "Please choose an image file.", "warn"); return; }
    const maxKb = Store.data.settings.prefs.imageMaxKb || 512;
    const reader = new FileReader();
    reader.onerror = () => this.toast("Could not read image", "The file could not be loaded.", "bad");
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => this.toast("Could not decode image", "That image format is not supported by this browser.", "bad");
      img.onload = () => {
        const maxSide = 720;
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#0b1424"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = 0.82, out = "";
        for (let i = 0; i < 7; i++) {
          out = c.toDataURL("image/jpeg", q);
          const kb = Math.round((out.length * 0.75) / 1024);
          if (kb <= maxKb || q <= 0.35) break;
          q -= 0.1;
        }
        if (cb) cb(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  },

  /* ---- top bar + tabs ---- */
  syncTopbar() {
    const isSettings = Router.current === "settings";
    $("#topbarRight").innerHTML =
      '<button class="icon-btn' + (isSettings ? " active" : "") + '" id="btnSettings" aria-label="Settings" title="Settings">' + icon("settings", 20) + "</button>";
    $("#btnSettings").addEventListener("click", () => Router.go(isSettings ? Store._lastTab || "home" : "settings"));
  },
  syncNav() {
    const bar = $("#tabbar");

      const on = Router.current === t.id;

        dot + icon(t.icon, 21) + "<span>" + t.label + "</span></button>";
    }).join("");
    $$("[data-tab]", bar).forEach(b => b.addEventListener("click", () => {

  syncFooter() {

  render() {

  /* small SVG donut / sparkline / bar-chart builders (pure 2D, no libraries) */
  donut(parts, size, thickness, centerTop, centerBot) {
    size = size || 168; thickness = thickness || 15;
    const total = parts.reduce((a, p) => a + Math.max(0, p.value), 0);
    const r = (size - thickness) / 2, c = 2 * Math.PI * r;
    let off = 0;
    const segs = parts.map(p => {
      const frac = total > 0 ? Math.max(0, p.value) / total : 0;
      const len = frac * c;
      const s = '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="' + thickness +
        '" stroke-dasharray="' + len + " " + (c - len) + '" stroke-dashoffset="' + (-off) + '" stroke-linecap="butt" transform="rotate(-90 ' + size / 2 + " " + size / 2 + ')"/>';
      off += len;
      return s;
    }).join("");
    return '<div style="position:relative;width:' + size + "px;height:" + size + 'px;flex:0 0 auto">' +
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" aria-hidden="true">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="rgba(126,180,255,.10)" stroke-width="' + thickness + '"/>' +
      (total > 0 ? segs : "") + "</svg>" +
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">' +
      (centerTop ? '<div style="font-size:' + Math.round(size * 0.2) + "px;font-weight:750;font-variant-numeric:tabular-nums;font-family:var(--mono)\">" + centerTop + "</div>" : "") +
      (centerBot ? '<div style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700">' + centerBot + "</div>" : "") +
      "</div></div>";
  },
  bars(labels, values, opts) {
    opts = opts || {};
    const w = 100, n = Math.max(1, values.length);
    const step = w / n;
    const bw = Math.min(11, step * 0.56);
    const max = Math.max(1, ...values);
    const h = 56;
    const barsHtml = values.map((v, i) => {
      const bh = Math.max(v > 0 ? 2.5 : 1, (v / max) * (h - 8));
      const x = i * step + (step - bw) / 2;
      const y = h - bh;
      const fill = opts.colorFor ? opts.colorFor(i, v) : "url(#barGrad)";
      const dim = (opts.highlight != null && opts.highlight !== i) ? ' opacity=".38"' : "";
      return '<rect class="bar" x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + bh.toFixed(2) + '" rx="' + (bw / 2).toFixed(2) + '" fill="' + fill + '"' + dim + "><title>" + esc(labels[i]) + ": " + v + "</title></rect>";
    }).join("");
    return '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" style="height:112px" aria-hidden="true">' +
      '<defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-2)" stop-opacity=".45"/></linearGradient></defs>' +
      barsHtml + "</svg>";
  },
  sparkline(values, opts) {
    opts = opts || {};
    const n = Math.max(2, values.length);
    const max = Math.max(1, ...values);
    const W = 100, H = 30;
    const pts = values.map((v, i) => [(i / (n - 1)) * W, H - (v / max) * (H - 4) - 2]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" ");
    const area = line + " L" + W + " " + H + " L0 " + H + " Z";
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".42"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#sparkGrad)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
  },
  ring(value01, label, sub) {
    const r = 96, c = 2 * Math.PI * r;
    const off = c * (1 - clamp(value01, 0, 1));
    return '<div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true">' +
      '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-2)"/></linearGradient></defs>' +
      '<circle cx="110" cy="110" r="' + r + '" fill="none" stroke="rgba(126,180,255,.12)" stroke-width="12"/>' +
      '<circle class="rc" cx="110" cy="110" r="' + r + '" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      "</svg>" +
      '<div class="ring-in"><div class="ring-time" id="ringTime">' + label + "</div>" + (sub ? '<div class="ring-lab">' + sub + "</div>" : "") + "</div></div>";
  },
  miniRing(value01, text) {
    const r = 25, c = 2 * Math.PI * r;
    const off = c * (1 - clamp(value01, 0, 1));
    return '<div class="mini-ring"><svg viewBox="0 0 60 60" aria-hidden="true">' +
      '<circle cx="30" cy="30" r="' + r + '" fill="none" stroke="rgba(126,180,255,.14)" stroke-width="6"/>' +
      '<circle cx="30" cy="30" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '</svg><div class="v">' + esc(text) + "</div></div>";
  },

  /* delegated click helper */
  on(el, sel, evt, fn) {
    $$(sel, el).forEach(n => n.addEventListener(evt, e => fn(e, n)));
  }
};

/* ============================================================
   DATABASE LOOKUP HELPERS
   Pure reads over the static table above. No value is ever
   synthesised here — a missing field stays missing.
   ============================================================ */
const VehicleDB = {
  brands(type) { return VEHICLE_DB.brands.filter(b => !type || b.type === type); },
  brand(id) { return VEHICLE_DB.brands.find(b => b.id === id) || null; },
  models(brandId, type) {
    const b = this.brand(brandId);
    if (!b) return [];
    if (type && b.type !== type) return [];
    return b.models;
  },
  model(brandId, modelId) { const b = this.brand(brandId); return b ? (b.models.find(m => m.id === modelId) || null) : null; },
  entry(brandId, modelId, variantIndex) {
    const m = this.model(brandId, modelId);
    if (!m) return null;
    const v = m.variants[variantIndex || 0];
    return v ? { brand: this.brand(brandId), model: m, variant: v, variantIndex: variantIndex || 0 } : null;
  },
  years(m) {
    if (!m) return [];
    const to = m.to || new Date().getFullYear();
    const out = [];
    for (let y = to; y >= m.from; y--) out.push(y);
    return out;
  },
  yearLabel(m) { return m.to ? (m.from === m.to ? String(m.from) : m.from + "–" + m.to) : m.from + "–present"; },
  /* Simple search across brand, model and engine text. */
  search(query, type) {
    const q = String(query || "").trim().toLowerCase();
    if (!q) return [];
    const hits = [];
    this.brands(type).forEach(b => {
      b.models.forEach(m => {
        m.variants.forEach((v, i) => {
          const hay = [b.name, m.name, m.gen, m.body, v.name, v.fuel, v.engine, v.cc].filter(Boolean).join(" ").toLowerCase();
          if (hay.indexOf(q) > -1) hits.push({ brand: b, model: m, variant: v, variantIndex: i });
        });
      });
    });
    return hits.slice(0, 40);
  },
  /* Best match for a brand/model/year the user typed by hand. Returns null
     rather than a guess when nothing lines up. */
  match(brandText, modelText, year, type) {
    const bq = String(brandText || "").trim().toLowerCase();
    const mq = String(modelText || "").trim().toLowerCase();
    if (!mq) return null;
    const y = Number(year) || null;
    let best = null;
    this.brands(type).forEach(b => {
      const brandHit = bq && (b.name.toLowerCase().indexOf(bq) > -1 || bq.indexOf(b.name.toLowerCase()) > -1);
      b.models.forEach(m => {
        const mName = m.name.toLowerCase();
        if (!(mName.indexOf(mq) > -1 || mq.indexOf(mName) > -1)) return;
        if (y && (y < m.from || (m.to && y > m.to))) return;
        const score = (brandHit ? 2 : 0) + (mName === mq ? 2 : 1) + (y ? 1 : 0);
        if (!best || score > best.score) best = { score, brand: b, model: m, variantIndex: 0 };
      });
    });
    if (!best) return null;
    return { brandId: best.brand.id, modelId: best.model.id, variantIndex: best.variantIndex, year: y };
  },

  /* Which of the requested information rows this entry can answer. */
  infoRows(entry, year) {
    const label = "Information unavailable";
    const v = entry && entry.variant ? entry.variant : {};
    const m = entry && entry.model ? entry.model : {};
    const b = entry && entry.brand ? entry.brand : {};
    const rows = [
      ["Brand", b.name],
      ["Model", m.name ? m.name + (m.gen ? " · " + m.gen : "") : null],
      ["Variant", v.name],
      ["Model year", year ? String(year) : null],
      ["Fuel type", v.fuel],
      ["Engine capacity", v.cc ? nfmt(v.cc) + " cc" : (v.extra ? (v.extra.find(e => e[0] === "Engine capacity") || [])[1] : null)],
      ["Engine", v.engine],
      ["Transmission", v.trans],
      ["Power", v.power],
      ["Torque", v.torque],
      ["Seating capacity", v.seats ? v.seats + (v.seats === 2 ? " (rider + pillion)" : " seats") : null],
      ["Dimensions (L × W × H)", v.dims],
      ["Body style", m.body],
      ["Image", null]
    ];
    const extras = (v.extra || []).filter(e => e[0] !== "Engine capacity");
    return { rows: rows.map(r => ({ label: r[0], value: r[1] || label, known: !!r[1] })), extras, missing: label };
  }
};
/* ============================================================
   PLATFORM LAYER — one rule: real data, or an honest limitation.
   Nothing here is ever simulated.
   ============================================================ */
const Platform = {
  touch: ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0,
  secure: window.isSecureContext !== false,
  ua: {
    android: /Android/i.test(navigator.userAgent),
    ios: /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1),
    standalone: (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true
  },
  get platformLabel() {
    if (this.ua.android) return "Android";
    if (this.ua.ios) return "iOS / iPadOS";
    return "Desktop browser";
  }
};

/* ------------------------------------------------------------
   BLUETOOTH  (Web Bluetooth — what a web page can really do)
   ------------------------------------------------------------ */
const BT = {
  state: "unknown",          // supported | unsupported | insecure | unavailable | off
  reason: "",
  availability: null,        // from navigator.bluetooth.getAvailability() when available
  device: null,              // the single live BluetoothDevice granted by the user
  linkedProfileId: null,
  lastError: null,
  busy: false,
  gattServices: null,
  listeners: [],

  get nav() { return navigator.bluetooth || null; },

  async probe() {
    this.lastError = null;
    if (!this.nav) {
      this.state = "unsupported";
      this.reason = Platform.ua.ios
        ? "Safari and every iOS browser do not expose the Web Bluetooth API."
        : "This browser does not expose the Web Bluetooth API. Chrome, Edge and Opera on desktop or Android do.";
      return this.status();
    }
    if (!Platform.secure) {
      this.state = "insecure";
      this.reason = "Web Bluetooth only works on a secure HTTPS origin (or localhost).";
      return this.status();
    }
    if (typeof this.nav.getAvailability === "function") {
      try {
        this.availability = await this.nav.getAvailability();
        if (this.availability === false) {
          this.state = "unavailable";
          this.reason = "The browser reports that no Bluetooth adapter is available to this page. On some systems the browser also reports false until the first permission prompt.";
          return this.status();
        }
      } catch (e) { this.availability = null; }
    }
    this.state = "supported";
    this.reason = "";
    return this.status();
  },
  status() {
    const map = {
      supported:   { label: "Bluetooth Available",   kind: "ok",   text: "This browser exposes the Web Bluetooth API and reports a usable adapter." },
      unavailable: { label: "Bluetooth Unavailable", kind: "warn", text: "No Bluetooth adapter is reported by the browser. You can still keep device profiles." },
      unsupported: { label: "Bluetooth Unsupported", kind: "bad",  text: "This platform cannot access Bluetooth from a web page." },
      insecure:    { label: "Needs HTTPS",           kind: "bad",  text: "Bluetooth is blocked because this page is not on a secure origin." },
      unknown:     { label: "Checking…",             kind: "",     text: "" }
    };
    return Object.assign({ state: this.state, detail: this.reason }, map[this.state] || map.unknown);
  },

  /* --- remember previously granted devices across sessions (browser-managed list) --- */
  async remembered() {
    if (!this.nav || typeof this.nav.getDevices !== "function") return { supported: false, devices: [] };
    try {
      const list = await this.nav.getDevices();
      return { supported: true, devices: list };
    } catch (e) {
      return { supported: false, devices: [], error: e.message };
    }
  },

  async matchProfile(profile) {
    const rem = await this.remembered();
    if (!rem.supported) return null;
    if (profile.btDeviceId) {
      const hit = rem.devices.find(d => d.id === profile.btDeviceId);
      if (hit) return hit;
    }
    if (profile.btDeviceName) {
      const hit = rem.devices.find(d => d.name && d.name.toLowerCase() === profile.btDeviceName.toLowerCase());
      if (hit) return hit;
    }
    return null;
  },

  async scan() {
    if (!this.nav || !Platform.secure) { await this.probe(); return null; }
    this.busy = true; this.lastError = null;
    try {
      const opts = {
        acceptAllDevices: true,
        optionalServices: []
      };
      const dev = await this.nav.requestDevice(opts);
      this.device = dev;
      this.attach(dev);
      await this.probe();
      return dev;
    } catch (e) {
      this.lastError = this.describe(e);
      if (e && e.name !== "NotFoundError") Store.log("security_notice", "Bluetooth scan could not start: " + this.lastError, null);
      throw e;
    } finally {
      this.busy = false;
    }
  },

  attach(dev) {
    if (!dev || !dev.addEventListener) return;
    dev.addEventListener("gattserverdisconnected", () => {
      const p = Store.getDevice(this.linkedProfileId || "");
      const name = dev.name || "Bluetooth device";
      this.gattServices = null;
      if (p) Store.setDeviceStatus(p.id, "disconnected", { live: { lastDisconnectedAt: nowIso(), gattServices: null }, log: { action: "device_disconnect", detail: "The live link to “" + name + "” ended while the page was open (device moved away, powered off, or closed the connection)." } });
      UI.toast("Disconnected", name + " is no longer connected.", "warn");
      UI.refresh();
    });
  },

  async connect(dev) {
    if (!dev || !dev.gatt) throw new Error("This device entry has no GATT server handle.");
    const server = await dev.gatt.connect();
    let services = [];
    try {
      const prim = await server.getPrimaryServices();
      services = prim.map(s => s.uuid);
    } catch (e) { services = []; }
    this.gattServices = services;
    return { server, services };
  },

  async link(profile, btDev) {
    const res = await this.connect(btDev);
    this.device = btDev;
    this.linkedProfileId = profile.id;
    this.attach(btDev);
    const svcNote = res.services.length ? " Exposed " + res.services.length + " GATT service(s)." : " The device exposed no readable GATT services.";
    Store.setDeviceStatus(profile.id, "connected", {
      live: { linkedName: btDev.name || "Unnamed Bluetooth device", linkedAt: nowIso(), lastConnectedAt: nowIso(), lastError: null, gattServices: res.services },
      log: { action: "device_connect", detail: "Connected to “" + (btDev.name || "unnamed device") + "” over real Web Bluetooth GATT." + svcNote }
    });
    Store.updateDevice(profile.id, { btDeviceId: btDev.id, btDeviceName: btDev.name || null });
    return res;
  },

  async pairNew(profile) {
    const dev = await this.nav.requestDevice({ acceptAllDevices: true });
    const res = await this.link(profile, dev);
    this.availability = true; this.state = "supported"; this.reason = "";
    return { dev, res };
  },

  disconnect() {
    if (this.device && this.device.gatt && this.device.gatt.connected) {
      this.device.gatt.disconnect();
      return true;
    }
    this.device = null;
    this.gattServices = null;
    return false;
  },

  /* Standard GATT Device Information Service — where a peripheral publishes it,
     these values are real device-reported strings (not guesses). */
  async readDeviceInfo() {
    const dev = this.device;
    if (!dev || !dev.gatt || !dev.gatt.connected) return { ok: false, reason: "No live Bluetooth connection." };
    const chars = { 0x2a29: "manufacturer", 0x2a24: "model", 0x2a26: "firmware", 0x2a25: "serial", 0x2a27: "hardware", 0x2a28: "software" };
    const out = {};
    try {
      const svc = await dev.gatt.getPrimaryService("device_information");
      const list = await svc.getCharacteristics();
      for (const ch of list) {
        const key = chars[Number(ch.uuid.length === 4 ? parseInt(ch.uuid, 16) : 0)];
        if (!key || !ch.readValue) continue;
        try {
          const val = await ch.readValue();
          out[key] = new TextDecoder("utf-8").decode(val.buffer).replace(/\u0000+$/, "").trim();
        } catch (e) { /* characteristic present but not readable — ignored, never invented */ }
      }
      if (!Object.keys(out).length) return { ok: false, reason: "The device exposes a Device Information Service but no readable fields." };
      return { ok: true, info: out };
    } catch (e) {
      return { ok: false, reason: "This device does not publish the standard GATT Device Information Service, so the browser cannot read its manufacturer, model or firmware." };
    }
  },

  /* Enumerate everything the page is allowed to see on the live connection. */
  async enumerate() {
    const dev = this.device;
    if (!dev || !dev.gatt || !dev.gatt.connected) return [];
    try {
      const services = await dev.gatt.getPrimaryServices();
      const out = [];
      for (const svc of services) {
        const entry = { uuid: svc.uuid, chars: [] };
        try {
          const list = await svc.getCharacteristics();
          entry.chars = list.map(c => ({ uuid: c.uuid, props: Object.keys(c.properties || {}).filter(k => c.properties[k] === true) }));
        } catch (e) {}
        out.push(entry);
      }
      return out;
    } catch (e) { return []; }
  },

  describe(e) {
    if (!e) return "Unknown error.";
    switch (e.name) {
      case "NotFoundError":        return "No device was selected. The chooser was closed or cancelled.";
      case "SecurityError":        return "The browser blocked the request. Web Bluetooth needs HTTPS and a direct tap on the button.";
      case "NotSupportedError":    return "This browser build has Bluetooth disabled by policy or by the user's setting.";
      case "InvalidStateError":    return "The browser is already showing a chooser, or the device is busy.";
      case "NetworkError":         return "The Bluetooth connection attempt failed (the device did not respond).";
      case "AbortError":           return "The connection attempt was aborted.";
      default: return e.message || String(e);
    }
  },

  /* real battery info where the GATT Battery Service is exposed by the device */
  async readBattery() {
    const dev = this.device;
    if (!dev || !dev.gatt || !dev.gatt.connected) return { ok: false, reason: "No live Bluetooth connection." };
    try {
      const svc = await dev.gatt.getPrimaryService("battery_service");
      const ch = await svc.getCharacteristic("battery_level");
      const val = await ch.readValue();
      return { ok: true, level: val.getUint8(0) };
    } catch (e) {
      return { ok: false, reason: "This device does not expose the standard GATT Battery Service, so the browser cannot read its battery level." };
    }
  }
};

/* ------------------------------------------------------------
   NATIVE BRIDGE — for a real Android wrapper (WebView JS interface)
   This build ships no native shell, so the bridge is only ever used
   when the host app genuinely injects one. Nothing is simulated.
   ------------------------------------------------------------ */
const NativeBridge = {
  /* A native wrapper can expose any of these globals (Android
     addJavascriptInterface or a promise-based iOS bridge). */
  find() {
    const cands = [
      { name: "MyDeviceHubNative", obj: window.MyDeviceHubNative, platform: "Android" },
      { name: "AndroidDeviceHub", obj: window.AndroidDeviceHub, platform: "Android" },
      { name: "webkit.messageHandlers.mdhNative", obj: window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mdhNative, platform: "iOS" }
    ];
    return cands.find(c => c.obj) || null;
  },
  get available() { return !!this.find(); },
  describe() {
    const b = this.find();
    if (!b) return { available: false, reason: "No native shell is hosting this page, so the native Android vehicle APIs are not reachable." };
    return { available: true, platform: b.platform, name: b.name };
  },
  /* Capability probe — the wrapper decides what it can actually do.
     Expected contract (all optional):
       getCapabilities() -> JSON string { vehicleBluetooth:true, obd:true, wifi:true, vehicleApi:true }
       subscribeVehicle(id) / unsubscribeVehicle(id)
     and it may call window.MDHNative.pushVehicleData(json). */
  capabilities() {
    const b = this.find();
    if (!b) return null;
    try {
      if (typeof b.obj.getCapabilities === "function") {
        const raw = b.obj.getCapabilities();
        return typeof raw === "string" ? JSON.parse(raw) : raw;
      }
    } catch (e) { return { error: e.message }; }
    return {};
  },
  subscribe(vehicleId) {
    const b = this.find();
    if (!b || typeof b.obj.subscribeVehicle !== "function") return false;
    try { b.obj.subscribeVehicle(vehicleId); return true; } catch (e) { return false; }
  },
  unsubscribe(vehicleId) {
    const b = this.find();
    if (!b || typeof b.obj.unsubscribeVehicle !== "function") return false;
    try { b.obj.unsubscribeVehicle(vehicleId); return true; } catch (e) { return false; }
  },
  /* Entry point the native side calls with real readings. */
  installReceiver() {
    window.MDHNative = {
      pushVehicleData: payload => {
        try {
          const data = typeof payload === "string" ? JSON.parse(payload) : payload;
          if (data && data.vehicleId && typeof VehicleLive !== "undefined") VehicleLive.ingest(data.vehicleId, data.fields || data, "native");
        } catch (e) { console.warn("[My Device Hub] native payload rejected", e); }
      },
      notifyEvent: (kind, detail) => { Store.log("integration_connect", String(detail || kind || "Native event"), null); UI.refresh(); }
    };
  }
};

/* ------------------------------------------------------------
   NETWORK / WI-FI — only what the browser genuinely exposes
   ------------------------------------------------------------ */
const Net = {
  conn: null,
  supported: false,
  since: nowIso(),
  lastChange: null,
  changes: [],
  listeners: [],

  init(trackChanges) {
    if (typeof navigator.onLine !== "boolean") return;
    this.conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
    this.supported = !!this.conn;
    this.tracking = trackChanges !== false;
    if (this.conn && this.conn.addEventListener && this.tracking) {
      const h = () => {
        const snap = this.snapshot();
        const label = snap.type !== "unknown" ? snap.typeLabel : (snap.effectiveType || "Unknown");
        const prev = this.changes[0];
        if (!prev || prev.to !== label) {
          this.changes.unshift({ from: prev ? prev.to : null, to: label, at: nowIso() });
          if (this.changes.length > 40) this.changes.length = 40;
        }
        UI.refresh();
      };
      this.conn.addEventListener("change", h);
      this.listeners.push(h);
    }
  },
  onOnline() {
    this.since = nowIso();
    const snap = this.snapshot();
    this.changes.unshift({ from: "Offline", to: snap.type !== "unknown" ? snap.typeLabel : "Online", at: nowIso() });
    if (this.changes.length > 40) this.changes.length = 40;
    UI.refresh();
  },
  onOffline() {
    this.since = nowIso();
    this.changes.unshift({ from: this.changes[0] ? this.changes[0].to : null, to: "Offline", at: nowIso() });
    if (this.changes.length > 40) this.changes.length = 40;
    UI.refresh();
  },

  snapshot() {
    const c = this.conn;
    const typeMap = { bluetooth: "Bluetooth", cellular: "Cellular", ethernet: "Ethernet", wifi: "Wi-Fi", wimax: "WiMAX", none: "No link", other: "Other", unknown: "Unknown" };
    const raw = c && c.type ? c.type : "unknown";
    return {
      online: navigator.onLine === true,
      type: raw,
      typeLabel: typeMap[raw] || "Unknown",
      effectiveType: c && c.effectiveType ? String(c.effectiveType).toUpperCase() : null,
      downlink: c && typeof c.downlink === "number" ? c.downlink : null,
      downlinkMax: c && typeof c.downlinkMax === "number" ? c.downlinkMax : null,
      rtt: c && typeof c.rtt === "number" ? c.rtt : null,
      saveData: c && typeof c.saveData === "boolean" ? c.saveData : null,
      apiName: c ? ((c === navigator.connection && "Network Information API (connection)") || "Network Information API") : null
    };
  },
  isPrivateContext() {
    return !(window.isSecureContext === false);
  },
  /* honest explanation strings */
  limits(html) { return html; }
};

/* ------------------------------------------------------------
   CAPABILITIES — the single honest source of truth for what this
   runtime can and cannot reach. Every screen reads from here.
   ------------------------------------------------------------ */
const Caps = {
  get webBluetooth() {
    return {
      id: "obd-ble",
      supported: !!navigator.bluetooth && Platform.secure,
      reason: !navigator.bluetooth
        ? (Platform.ua.ios ? "iOS browsers do not expose the Web Bluetooth API." : "This browser does not expose the Web Bluetooth API.")
        : (!Platform.secure ? "Bluetooth needs a secure HTTPS origin." : "")
    };
  },
  get telemetryEndpoint() {
    return { id: "http", supported: typeof fetch === "function", reason: typeof fetch === "function" ? "" : "This runtime has no fetch()." };
  },
  get nativeBridge() { return NativeBridge.describe(); },
  get geolocation() { return { id: "gps", supported: !!navigator.geolocation, reason: navigator.geolocation ? "" : "This runtime exposes no Geolocation API." }; },
  get webBluetoothGps() { return !!navigator.bluetooth; },
  summary() {
    return {
      platform: Platform.platformLabel,
      secure: Platform.secure,
      obdBle: this.webBluetooth.supported,
      endpoint: this.telemetryEndpoint.supported,
      native: this.nativeBridge.available,
      gps: this.geolocation.supported,
      anyVehicleSource: this.webBluetooth.supported || this.telemetryEndpoint.supported || this.nativeBridge.available
    };
  }
};

/* ------------------------------------------------------------
   PERMISSIONS — queried live, never assumed
   ------------------------------------------------------------ */
const Perm = {
  async queryAll() {
    const out = [];
    const push = (key, label, why) => out.push({ key, label, why, state: "unsupported" });
    if (!navigator.permissions || !navigator.permissions.query) {
      out.push({ key: "api", label: "Permissions API", why: "This browser does not expose navigator.permissions, so nothing can be queried.", state: "unsupported" });
      return out;
    }
    const names = [
      { name: "bluetooth",  key: "bluetooth",  label: "Bluetooth",    why: "Asked only when you tap SCAN, and only for the single device you pick in the browser's own chooser." },
      { name: "geolocation",key: "location",   label: "Location",     why: "Needed only if you ever allow the browser to reveal Wi-Fi network names — the OS treats those names as location data." },
      { name: "notifications", key: "notify",  label: "Notifications",why: "Used for focus-timer and reminder alerts. Purely optional." },
      { name: "camera",     key: "camera",     label: "Camera",       why: "Only if you photograph a device or your car instead of uploading a file." },
      { name: "clipboard-write", key: "clipboard", label: "Clipboard",why: "Only to copy technical values you tap on the Wi-Fi or device pages." }
    ];
    for (const n of names) {
      try {
        const st = await navigator.permissions.query({ name: n.name });
        out.push({ key: n.key, label: n.label, why: n.why, state: st.state, obj: st });
      } catch (e) {
        out.push({ key: n.key, label: n.label, why: n.why, state: "unsupported", note: "This browser does not let a page query this permission." });
      }
    }
    return out;
  }
};


/* ============================================================
   VIEW TICKERS — intervals registered by a view are cleared
   automatically when the view is replaced.
   ============================================================ */
UI._tickers = [];
UI.every = function (fn, ms) {
  const id = setInterval(fn, ms);
  this._tickers.push(id);
  return id;
};
UI.clearTickers = function () {
  this._tickers.forEach(clearInterval);
  this._tickers = [];

};

function deviceStatusMeta(d) {
  if (!d) return { label: "Unknown", kind: "", dot: false };
  switch (d.status) {
    case "connected":    return { label: "Connected", kind: "ok", dot: true, live: true };
    case "disconnected": return { label: "Disconnected", kind: "warn", dot: true };
    case "unknown":      return { label: "Unknown", kind: "", dot: true };
    default:             return { label: "Saved profile", kind: "", dot: false };
  }
}
function deviceLiveLine(d) {
  if (d.status === "connected" && d.live && d.live.linkedName) {
    return "Live link to “" + d.live.linkedName + "” since " + relTime(d.live.linkedAt || d.live.lastConnectedAt);
  }
  if (d.status === "disconnected") return "Last live link ended " + relTime(d.live && d.live.lastDisconnectedAt) + ".";
  if (d.status === "unknown") return "Status was never confirmed by a real connection.";
  return "No live connection. This is a saved profile only.";
}

/* ============================================================
   DEVICE ACTIONS
   ============================================================ */
const DeviceActions = {
  async connect(profileId, btn) {
    const p = Store.getDevice(profileId);
    if (!p) return;
    if (!BT.nav) { UI.toast("Bluetooth unsupported", BT.status().detail, "bad"); return; }
    const label = btn ? btn.innerHTML : null;
    if (btn) { btn.disabled = true; btn.innerHTML = icon("refresh", 15) + " Working…"; }
    try {
      let remembered = null;
      if (p.btDeviceId || p.btDeviceName) {
        try { remembered = await BT.matchProfile(p); } catch (e) { remembered = null; }
      }
      if (remembered) {
        await BT.link(p, remembered);
        UI.toast("Connected", "Reconnected to “" + (remembered.name || "device") + "” using the browser's granted-device list.", "ok");
      } else {
        UI.toast("Choose the device", "Pick this device in the browser's own Bluetooth chooser.", "");
        const dev = await BT.nav.requestDevice({ acceptAllDevices: true });
        await BT.link(p, dev);
        UI.toast("Connected", "Linked “" + (dev.name || "unnamed device") + "” to this profile.", "ok");
      }
      UI.refresh();
    } catch (e) {
      const msg = BT.describe(e);
      BT.lastError = msg;
      Store.setDeviceStatus(p.id, p.status === "connected" ? "connected" : "unknown", { live: { lastError: msg } });
      UI.toast("Connection not established", msg, e && e.name === "NotFoundError" ? "warn" : "bad");
      UI.refresh();
    } finally {
      if (btn && document.body.contains(btn)) { btn.disabled = false; if (label) btn.innerHTML = label; }
    }
  },
  disconnect() {
    const name = BT.device ? (BT.device.name || "the device") : "the device";
    const p = Store.getDevice(BT.linkedProfileId || "");
    const did = BT.disconnect();
    if (p) Store.setDeviceStatus(p.id, "disconnected", {
      live: { lastDisconnectedAt: nowIso(), gattServices: null },
      log: { action: "device_disconnect", detail: "You closed the live link to “" + name + "”." }
    });
    UI.toast(did ? "Disconnected" : "Nothing to disconnect", did ? "The live link to " + name + " was closed by you." : "No active Bluetooth link was open.", did ? "ok" : "warn");
    UI.refresh();
  },
  async battery() {
    const r = await BT.readBattery();
    if (r.ok) UI.toast("Battery level", "The device reported " + r.level + "% over the standard GATT Battery Service.", "ok");
    else UI.toast("Battery not readable", r.reason, "warn");
  }
};

          '<div class="field"><label>Serial / asset ID</label><input class="input" id="fSerial" value="' + esc(d.serial) + '" placeholder="optional"></div>',
        "</div>",

        '<div class="notice"><span class="ni">' + icon("info", 17) + "</span><div><b>Live status stays separate.</b> A new profile is saved with the status “Saved profile”. It becomes <i>Connected</i> only if you later tap Connect and a real Bluetooth link opens.</div></div>",

function deleteDeviceFlow(d) {
  if (!d) return;
  UI.confirm({
    title: "Delete “" + d.name + "”?",
    message: "The saved profile, its notes and its remembered connection history will be removed from this device. This cannot be undone.",
    confirmText: "Delete device"
  }).then(ok => {
    if (!ok) return;
    Store.deleteDevice(d.id);
    UI.toast("Device deleted", "“" + d.name + "” was removed from the hub.", "ok");
    Router.go("devices");
  });
}

/* ------------------------------------------------------------
   shared click wiring for device rows / quick actions
   ------------------------------------------------------------ */
function bindDeviceInteractions(root) {
  $$("[data-device]", root).forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener("click", e => {
      if (e.target.closest("[data-no-nav]")) return;
      e.stopPropagation();
      Router.go("device", { id: el.dataset.device });
    });
  });
  $$("[data-add-device]", root).forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener("click", e => { e.stopPropagation(); DeviceForm.open(null); });
  });
  $$("[data-open-device]", root).forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener("click", e => { e.stopPropagation(); Router.go("device", { id: el.dataset.openDevice }); });
  });
  $$("[data-add-task]", root).forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener("click", e => { e.stopPropagation(); openTaskForm(null); });
  });
  $$("[data-go]", root).forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener("click", () => Router.go(el.dataset.go));
  });
  const qaMap = {
    "home-qa-add": () => DeviceForm.open(null),
    "home-qa-addveh": () => VehicleForm.open(null),
    "home-qa-bt": () => { Router.go("bluetooth"); setTimeout(() => BluetoothView.scanFlow({}), 350); },
    "home-qa-wifi": () => Router.go("wifi"),
    "home-qa-car": () => Router.go("car"),
    "home-qa-focus": () => Router.go("focus")
  };
  Object.keys(qaMap).forEach(id => { const el = $("#" + id, root); if (el) el.addEventListener("click", qaMap[id]); });
}

/* ============================================================
   BLUETOOTH VIEW
   ============================================================ */
const BluetoothView = {
  async scanFlow(opts) {
    opts = opts || {};
    if (!BT.nav) {
      UI.toast("Bluetooth unavailable", BT.status().detail, "bad");
      return;
    }
    if (!Platform.secure) { UI.toast("HTTPS required", BT.status().detail, "bad"); return; }
    UI.toast("Opening chooser", "The browser's own Bluetooth dialog is the only way a web page can see a device. Pick one to continue.", "");
    try {
      const dev = await BT.scan();
      if (!dev) return;
      const name = dev.name || "Unnamed Bluetooth device";
      const profile = Store.data.devices.find(d => d.btDeviceId === dev.id) ||
                      Store.data.devices.find(d => d.btDeviceName && dev.name && d.btDeviceName.toLowerCase() === dev.name.toLowerCase()) ||
                      (opts.thenLinkProfile ? Store.getDevice(opts.thenLinkProfile) : null);
      UI.modal({
        body: [
          '<div class="sheet-head"><div><h3>Device selected</h3><div class="sub">This is a real device the browser just handed to this page.</div></div></div>',
          '<div class="row"><span class="avatar sm">' + icon("bluetooth", 20) + '</span><div class="grow"><div class="name">' + esc(name) + '</div><div class="meta">Advertised name from the Bluetooth device itself</div></div></div>',
          '<div style="margin-top:12px">',
            UI.kv("Browser device id", esc(dev.id.slice(0, 18)) + (dev.id.length > 18 ? "…" : ""), false),
            UI.kv("GATT available", dev.gatt ? "yes" : "no", false),
            UI.kv("Watch advertisements", typeof dev.watchAdvertisements === "function" ? "supported" : "not supported", false),
          "</div>",
          (profile ? '<div style="margin-top:14px">' + UI.notice("This matches your saved profile <b>" + esc(profile.name) + "</b>.", "ok") + "</div>"
                   : '<div style="margin-top:14px">' + UI.notice("This device is not saved in your hub yet. You can connect to it now, or add it as a profile first.") + "</div>"),
          '<div class="sheet-foot">',
            '<button class="btn btn-ghost" data-close>Close</button>',
            (profile

        ].join(""),
        onMount(sheet, close) {
          const doLink = $("[data-do-link]", sheet);

            try {
              await BT.link(Store.getDevice(doLink.dataset.doLink), dev);

            } catch (e) { UI.toast("Connection failed", BT.describe(e), "bad"); }
            UI.refresh();
          });
          const quick = $("[data-do-quick]", sheet);
          if (quick) quick.addEventListener("click", async () => {
            close();
            try {
              const res = await BT.connect(dev);
              BT.attach(dev);
              Store.data.settings.lastQuickBt = name;
              UI.toast("Connected", "Linked for this session. " + (res.services.length ? res.services.length + " GATT service(s) exposed." : "No GATT services were exposed."), "ok");

            UI.refresh();
          });

          if (save) save.addEventListener("click", () => {
            close();
            DeviceForm.open({ name: name, brand: "", model: "", category: "other", image: null, connection: "bluetooth", notes: "", serial: "", btDeviceId: dev.id, btDeviceName: dev.name || null });
          });
        }
      });
    } catch (e) {
      BT.lastError = BT.describe(e);
      if (e && e.name === "NotFoundError") UI.toast("No device selected", BT.lastError, "warn");
      else UI.toast("Scan failed", BT.lastError, "bad");
      UI.refresh();
    }
  },

  render() {

    const btProfiles = s.devices.filter(d => d.connection === "bluetooth" || d.btDeviceId);

    return [
      '<div class="page-head">',
        '<button class="icon-btn" data-back="home" aria-label="Back">' + icon("back", 19) + "</button>",
        "<div><div class=\"eyebrow\">Live hardware</div><h2>Bluetooth</h2>" +
        '<p class="sub">Everything on this page comes from the browser\'s Web Bluetooth API or from your own saved profiles. If a value cannot be read, it says so.</p></div>',

      '<div class="card" style="margin-bottom:16px">',
        '<div class="row-between" style="align-items:flex-start;gap:16px;flex-wrap:wrap">',

            '<div class="card-head" style="margin-bottom:8px"><span class="card-ico">' + icon("bluetooth", 18) + '</span><span class="t">Adapter status</span></div>',

            '<div class="sub" style="margin-top:6px;max-width:60ch">' + esc(st.text) + "</div>",
            (st.detail ? '<div class="sub" style="margin-top:6px;max-width:60ch;color:var(--warn)">' + icon("warn", 13) + " " + esc(st.detail) + "</div>" : ""),
          "</div>",
          '<div class="stack" style="align-items:flex-end">' +

            '<span class="chip">' + (Platform.secure ? "secure origin" : "insecure origin") + "</span>" +
          "</div>",
        "</div>",
        '<div class="hr"></div>',
        '<div class="btn-row">',
          '<button class="btn btn-primary" data-bt-scan="1"' + (supported && Platform.secure ? "" : " disabled") + ">" + icon("scan", 15) + " Scan</button>",
          (live
            ? '<button class="btn btn-ok" data-bt-disconnect="1">' + icon("unlink", 15) + " Disconnect</button>"
            : '<button class="btn" data-bt-connect-profile="1"' + (st.state === "supported" && btProfiles.length ? "" : " disabled") + ">" + icon("link", 15) + " Connect</button>") +
          '<button class="btn" data-bt-refresh="1">' + icon("refresh", 15) + " Re-check adapter</button>" +
          '<button class="btn" data-bt-battery="1"' + (live ? "" : " disabled") + ">" + icon("sparkle", 15) + " Read battery</button>" +
        "</div>",
        '<div class="hint" style="margin-top:9px">Buttons that this platform cannot support stay disabled rather than doing nothing.</div>',
      "</div>",

      /* LIVE CONNECTION */
      '<div class="section-title">Live connection</div>',
      live
        ? '<div class="card" style="margin-bottom:16px">' +
            '<div class="row">' +
              '<span class="avatar">' + icon("bluetooth", 22) + "</span>" +
              '<div class="grow"><div class="name">' + esc(live.name || "Unnamed Bluetooth device") + '</div><div class="meta">Real GATT connection held by this page</div></div>' +
              UI.pill("Connected", "ok", true, true) +
            "</div>" +
            '<div class="hr"></div>' +
            UI.kv("Advertised name", live.name ? esc(live.name) : '<span class="dim">this device advertises no name</span>', false) +
            UI.kv("Opaque device id", esc(live.id.slice(0, 28)) + (live.id.length > 28 ? "…" : ""), false) +
            UI.kv("Saved profile", linked ? esc(linked.name) : '<span class="dim">not linked to a profile</span>', false) +
            UI.kv("Connected since", linked && linked.live && linked.live.lastConnectedAt ? esc(relTime(linked.live.lastConnectedAt)) : '<span class="dim">just now</span>', false) +
            UI.kv("GATT services exposed", (BT.gattServices && BT.gattServices.length) ? BT.gattServices.length + " service(s)" : '<span class="dim">none readable</span>', false) +
            ((BT.gattServices && BT.gattServices.length) ? '<div class="wrap" style="margin-top:10px">' + BT.gattServices.map(u => '<span class="chip">' + esc(String(u).slice(0, 20)) + (String(u).length > 20 ? "…" : "") + "</span>").join("") + "</div>" : "") +
            '<div class="hint" style="margin-top:10px">The device id is a per-origin identifier created by the browser. Your Bluetooth MAC address is deliberately not exposed to web pages.</div>' +
          "</div>"
        : UI.notice("<b>No live Bluetooth connection.</b> A web page can only see devices you hand it through the browser's own chooser, and only while the page is open. Nothing is connected right now — and nothing is invented to fill the space.", "", "bluetooth"),

      '<div class="section-title">Devices this browser already trusts <span class="spacer"></span><button class="link-btn" data-bt-refresh="1">Refresh</button></div>',

        '<div class="form-grid" style="gap:16px">',
          '<div>' + UI.notice("<b>Can do</b><ul>" +
            "<li>Ask the browser for a device chooser, after a direct tap on SCAN or CONNECT</li>" +
            "<li>Read the name the device advertises and its opaque browser id</li>" +
            "<li>Open a real GATT connection, list exposed services, and read standard characteristics such as the GATT Battery Service when the device supports it</li>" +

  async afterRender(root) {
    bindDeviceInteractions(root);
    $$("[data-back]", root).forEach(b => b.addEventListener("click", () => Router.go(b.dataset.back || "home")));
    $$("[data-bt-scan]", root).forEach(b => b.addEventListener("click", () => BluetoothView.scanFlow({})));
    $$("[data-bt-refresh]", root).forEach(b => b.addEventListener("click", async () => {
      UI.toast("Re-checking adapter", "Asking the browser for its current Bluetooth availability.", "");
      await BT.probe();
      UI.refresh();
    }));
    $$("[data-bt-disconnect]", root).forEach(b => b.addEventListener("click", () => DeviceActions.disconnect()));
    $$("[data-bt-battery]", root).forEach(b => b.addEventListener("click", () => DeviceActions.battery()));
    $$("[data-bt-connect-profile]", root).forEach(b => b.addEventListener("click", () => {
      const btn = $("[data-connect-profile]", root);
      if (btn) btn.click();
      else UI.toast("No Bluetooth profile", "Add a device with the Bluetooth connection type first.", "warn");
    }));
    $$("[data-connect-profile]", root).forEach(b => b.addEventListener("click", () => DeviceActions.connect(b.dataset.connectProfile, b)));
    $$("[data-relink]", root).forEach(b => b.addEventListener("click", () => DeviceActions.connect(b.dataset.relink, b)));
    await BluetoothView.loadGranted();
  },

  async loadGranted() {
    const box = $("#grantedBox");
    if (!box) return;
    const rem = await BT.remembered();
    if (!box.isConnected) return;
    if (!rem.supported) {
      box.innerHTML = '<div class="sub">The browser does not expose <span class="mono">navigator.bluetooth.getDevices()</span>, so previously granted devices cannot be listed. ' +
        (BT.nav ? "You can still scan and pick a device again." : "Bluetooth scanning is unavailable on this platform.") + "</div>";
      return;
    }
    if (!rem.devices.length) {
      box.innerHTML = '<div class="sub">No device has been granted to this site yet. After you scan and pick a device once, it appears here and can be reconnected without a new chooser.</div>';
      return;
    }
    box.innerHTML = '<div class="list">' + rem.devices.map(d => {
      const prof = Store.data.devices.find(x => x.btDeviceId === d.id) || Store.data.devices.find(x => x.btDeviceName && d.name && x.btDeviceName.toLowerCase() === d.name.toLowerCase());
      return '<div class="row"><span class="avatar sm">' + icon("bluetooth", 18) + '</span>' +
        '<div class="grow"><div class="name">' + esc(d.name || "Unnamed device") + '</div>' +
        '<div class="meta">' + (prof ? "Matched to saved profile: " + esc(prof.name) : "Not saved as a profile yet") + "</div></div>" +
        (prof
          ? '<button class="btn btn-sm btn-primary" data-relink="' + esc(prof.id) + '">Connect</button>'
          : '<button class="btn btn-sm" data-save-granted="1" data-id="' + esc(d.id) + '" data-name="' + esc(d.name || "") + '">Save profile</button>') +
        "</div>";
    }).join("") + "</div>";
    $$("[data-save-granted]", box).forEach(b => b.addEventListener("click", () => {
      DeviceForm.open({ name: b.dataset.name || "Bluetooth device", brand: "", model: "", category: "other", image: null, connection: "bluetooth", notes: "", serial: "", btDeviceId: b.dataset.id, btDeviceName: b.dataset.name || null });
    }));
    $$("[data-relink]", box).forEach(b => {
      if (b._bound) return; b._bound = true;
      b.addEventListener("click", () => DeviceActions.connect(b.dataset.relink, b));
    });
  }
};

}

function pillForPerm(state) {
  const map = {
    granted: { l: "Granted", k: "ok" },
    denied: { l: "Denied", k: "bad" },
    prompt: { l: "Not decided", k: "warn" },
    unsupported: { l: "Not queryable", k: "" }
  };
  const m = map[state] || { l: state, k: "" };
  return UI.pill(m.l, m.k, true);
}


/* ============================================================
   VEHICLES — multi-vehicle hub (cars and bikes only)
   Profile + reminders + real integration data. A profile never
   implies a connection, and the dashboard never invents a value.
   ============================================================ */
function vehicleConnectionMeta(v) {
  const st = (typeof vehicleConnState === "function") ? vehicleConnState(v) : CONN_STATES.not_connected;
  const adapter = v && v.connection ? Adapters.byId(v.connection.adapterId) : null;
  const text = {
    not_connected: "Nothing is linked yet. Choose a connection method to receive real vehicle data.",
    waiting: "The integration is linked. Values will appear as soon as the vehicle reports them.",
    live: "Real values are arriving from " + ((v.connection.adapterName) || "the connected integration") + ".",
    lost: (v.connection.lastError || "The integration stopped answering.") + " Reconnect to resume live data.",
    unsupported: "Vehicle integration is not available in this version. Vehicle profile and reminders are still available."
  }[st.id];
  return { id: st.id, label: st.label, kind: st.kind, dot: st.dot, live: st.id === "live", short: st.short, text };
}
function vehicleSubtitle(v) {
  return [v.brand, v.model, v.year].filter(Boolean).join(" ") || "Brand, model and year not set";
}
function vehicleLiveSummary(v) {
  const st = vehicleConnState(v);
  const live = VehicleLive.status(v.id);
  if (st.id === "live") return live.liveFields + " of " + live.totalFields + " fields receiving real data";
  if (st.id === "waiting") return "Integration linked — waiting for the first real reading";
  if (st.id === "lost") return "Connection lost · last reading " + (live.lastAt ? relTime(live.lastAt) : "—");
  const snap = (v.live && v.live.fields) ? Object.keys(v.live.fields).length : 0;
  if (snap) return "Last real snapshot " + relTime(v.live.at) + " · no live integration";
  return "No live vehicle data is currently available.";
}

function nextVehicleReminder(v) {
  const items = [];
  (v.serviceReminders || []).forEach(r => {
    if (r.done) return;
    if (r.dueDate) { const d = daysUntil(r.dueDate); if (d != null) items.push({ label: r.label || serviceLabel(r.type), when: d < 0 ? Math.abs(d) + " days overdue" : d === 0 ? "due today" : "in " + d + " days", days: d, ref: r.id }); }
    if (r.dueKm && v.odometerKm) { const left = Number(r.dueKm) - Number(v.odometerKm); if (!isNaN(left) && left <= 1500) items.push({ label: r.label || serviceLabel(r.type), when: left <= 0 ? "odometer interval reached" : "in about " + Math.round(left) + " km", days: left <= 0 ? -1 : Math.round(left / 400), ref: r.id }); }
  });
  if (v.insurance && v.insurance.expiresOn) { const d = daysUntil(v.insurance.expiresOn); if (d != null) items.push({ label: "Insurance renewal", when: d < 0 ? Math.abs(d) + " days expired" : d === 0 ? "expires today" : "in " + d + " days", days: d, ref: "insurance" }); }
  (v.importantDates || []).forEach(x => { if (!x.date) return; const d = daysUntil(x.date); if (d != null && d >= -30 && d <= 60) items.push({ label: x.label || "Important date", when: d < 0 ? Math.abs(d) + " days ago" : d === 0 ? "today" : "in " + d + " days", days: d, ref: x.id }); });
  if (!items.length) return null;
  items.sort((a, b) => a.days - b.days);
  return items[0];
}
function vehicleReminderList(v) {
  const out = [];
  (v.serviceReminders || []).forEach(r => {
    if (r.done) return;
    if (r.dueDate) { const d = daysUntil(r.dueDate); out.push({ num: d == null ? 9999 : d, label: r.label || serviceLabel(r.type), when: d == null ? "date not set" : (d < 0 ? "overdue by " + Math.abs(d) + " days" : d === 0 ? "due today" : "in " + d + " days"), sub: "dated reminder", id: r.id, r, insurance: false }); }
    else if (r.dueKm) { const left = v.odometerKm == null ? null : Number(r.dueKm) - Number(v.odometerKm); out.push({ num: left == null ? 9999 : left, label: r.label || serviceLabel(r.type), when: v.odometerKm == null ? "at " + nfmt(r.dueKm) + " km" : (left <= 0 ? "due now at " + nfmt(r.dueKm) + " km" : "in " + nfmt(left) + " km"), sub: "odometer reminder", id: r.id, r, insurance: false }); }
    else out.push({ num: 9999, label: r.label || serviceLabel(r.type), when: "no date or odometer set", sub: "reminder", id: r.id, r, insurance: false });
  });
  if (v.insurance && v.insurance.expiresOn) { const d = daysUntil(v.insurance.expiresOn); out.push({ num: d == null ? 9999 : d, label: "Insurance renewal", when: d == null ? "not set" : (d < 0 ? "expired " + Math.abs(d) + " days ago" : "in " + d + " days"), sub: v.insurance.provider || "policy", id: "insurance", insurance: true }); }
  (v.importantDates || []).forEach(x => { const d = daysUntil(x.date); if (d == null) return; out.push({ num: d, label: x.label || "Important date", when: d < 0 ? Math.abs(d) + " days ago" : "in " + d + " days", sub: "personal date", id: x.id, r: x, insurance: false }); });
  return out.sort((a, b) => a.num - b.num);
}

      $$("[data-back-type]", sheet).forEach(b => b.addEventListener("click", () => {
        if (existing) { close(); return; }
        self.sel = null; self.dbSel = null; self.dbOpen = true;
        redraw(false);
      }));
      $$("[data-db-change]", sheet).forEach(b => b.addEventListener("click", () => {
        self.dbOpen = true; self.sel = null; self.customPicked = false;
        if (!self.dbSel && !self.dbQuery) self.dbSel = null;
        redraw(false);
      }));
      $$("[data-db-detach]", sheet).forEach(b => b.addEventListener("click", () => {
        self.sel = null; self.dbSel = null; self.customPicked = true; self.dbOpen = false;
        UI.toast("Detached", "This profile will keep its own details, and the information rows will say “Information unavailable”.", "");
        redraw(false);
      }));
      $$("[data-set-type]", sheet).forEach(b => b.addEventListener("click", () => {
        self.draft.type = b.dataset.setType;
        const fuels = fuelOptions(self.draft.type);
        if (fuels.indexOf(self.draft.fuel) === -1) self.draft.fuel = fuels[0];
        redraw();
      }));
      $$("[data-pick-veh-img]", sheet).forEach(b => b.addEventListener("click", () => UI.pickImage(url => {
        self.draft.photo = url;
        const prev = $("#vehPrev", sheet);
        if (prev) prev.innerHTML = '<img src="' + esc(url) + '" alt="">';
      })));
      $$("[data-clear-veh-img]", sheet).forEach(b => b.addEventListener("click", () => {
        self.draft.photo = null;
        const prev = $("#vehPrev", sheet);
        if (prev) prev.innerHTML = icon(vehType(self.draft.type).icon, 26);
      }));
      $$("[data-save-vehicle]", sheet).forEach(b => b.addEventListener("click", () => {
        const nick = $("#vNick", sheet).value.trim();
        if (!nick) { UI.toast("Nickname required", "Give the vehicle a nickname so its card is recognisable.", "warn"); $("#vNick", sheet).focus(); return; }
        const odo = $("#vOdo", sheet).value.trim();
        const linked = !!(self.sel && VehicleDB.entry(self.sel.brandId, self.sel.modelId, self.sel.variantIndex));
        const patch = {
          type: self.draft.type, nickname: nick,
          plate: $("#vPlate", sheet).value.trim(),
          color: $("#vColor", sheet).value.trim(),
          odometerKm: odo === "" ? null : Math.max(0, Number(odo) || 0),
          vin: $("#vVin", sheet).value.trim(),
          notes: $("#vNotes", sheet).value,
          photo: self.draft.photo
        };
        if (!linked) {
          patch.year = $("#vYear", sheet) ? $("#vYear", sheet).value.trim() : "";
          patch.brand = $("#vBrand", sheet) ? $("#vBrand", sheet).value.trim() : "";
          patch.model = $("#vModel", sheet) ? $("#vModel", sheet).value.trim() : "";
          patch.fuel = $("#vFuel", sheet) ? $("#vFuel", sheet).value : "";
        }
        if (existing) {
          Store.updateVehicle(existing.id, patch);
          if (linked) Store.attachSpec(existing.id, self.sel);
          else if (existing.spec) Store.detachSpec(existing.id);
          UI.toast("Vehicle updated", "“" + nick + "” saved. Connection state is unchanged.", "ok");
        } else {
          const created = Store.addVehicle(patch);
          if (linked) {
            Store.attachSpec(created.id, self.sel);
            const info = Store.specInfo(Store.getVehicle(created.id));
            const known = info.rows.filter(r => r.known).length;
            UI.toast("Vehicle information added", known + " published spec field(s) came from the built-in database for “" + nick + "”.", "ok");
          } else {
            UI.toast("Custom profile created", "“" + nick + "” is saved. The information rows will say “Information unavailable” until you link a database entry.", "");
          }
          UI.toast("Vehicle profile created", "“" + created.nickname + "” is a profile only. Status: integration unavailable.", "ok");
          close();
          Router.go("vehicle", { id: created.id });
          return;
        }
        close();
        Router.go("vehicle", { id: existing.id });
      }));
    };

    const redraw = (backToType) => {
      UI.modalStack.slice().forEach(m => m.close && m.close());
      UI.modal({
        wide: true,
        body: (backToType || (!existing && !self.pickedType)) ? stepType()
              : (self.dbOpen ? stepDatabase() : stepDetails()),
        onMount(sheet, close) {
          const isDb = !!sheet.querySelector("[data-db-brand], [data-db-hit], #dbSearch");
          if (isDb) {
            const search = $("#dbSearch", sheet);
            if (search) {
              search.addEventListener("input", () => {
                self.dbQuery = search.value;
                const pos = search.selectionStart;
                redraw(false);
                const again = $("#dbSearch", document);
                if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
              });
            }
            $$("[data-db-brand]", sheet).forEach(b => b.addEventListener("click", () => {
              self.dbSel = { brandId: b.dataset.dbBrand, modelId: null, variantIndex: 0, year: null };
              redraw(false);
            }));
            $$("[data-db-model]", sheet).forEach(b => b.addEventListener("click", () => {
              const m = VehicleDB.model(self.dbSel.brandId, b.dataset.dbModel);
              self.dbSel = { brandId: self.dbSel.brandId, modelId: b.dataset.dbModel, variantIndex: 0, year: m ? (m.to || new Date().getFullYear()) : null };
              redraw(false);
            }));
            $$("[data-db-variant]", sheet).forEach(b => b.addEventListener("click", () => {
              self.dbSel = Object.assign({}, self.dbSel, { variantIndex: Number(b.dataset.dbVariant) });
              redraw(false);
            }));
            $$("[data-db-hit]", sheet).forEach(b => b.addEventListener("click", () => {
              const hits = VehicleDB.search(self.dbQuery, self.draft.type);
              const h = hits[Number(b.dataset.dbHit)];
              if (!h) return;
              self.dbSel = { brandId: h.brand.id, modelId: h.model.id, variantIndex: h.variantIndex, year: h.model.to || new Date().getFullYear() };
              self.dbQuery = "";
              redraw(false);
            }));
            const yearSel = $("#dbYear", sheet);
            if (yearSel) yearSel.addEventListener("change", () => { self.dbSel = Object.assign({}, self.dbSel, { year: Number(yearSel.value) }); });
            $$("[data-db-custom]", sheet).forEach(b => b.addEventListener("click", () => {
              self.sel = null; self.dbSel = null; self.customPicked = true; self.dbOpen = false;
              redraw(false);
            }));
            $$("[data-db-use]", sheet).forEach(b => b.addEventListener("click", () => {
              self.sel = Object.assign({}, self.dbSel);
              if (!self.draft.nickname) {
                const e = VehicleDB.entry(self.sel.brandId, self.sel.modelId, self.sel.variantIndex);
                if (e) self.draft.nickname = e.model.name;
              }
              self.dbOpen = false;
              redraw(false);
            }));
            $$("[data-close], [data-close-x]", sheet).forEach(x => x.addEventListener("click", close));
            return;
          }

          const isType = !!sheet.querySelector("[data-pick-type]");
          if (isType) {
            $$("[data-pick-type]", sheet).forEach(b => b.addEventListener("click", () => {
              self.draft.type = b.dataset.pickType;
              self.pickedType = true;
              self.dbOpen = true;          /* go on to brand → model → year → variant */
              self.dbSel = null; self.dbQuery = ""; self.customPicked = false; self.dbDone = false;
              Store.data.settings.prefs.defaultVehicleType = self.draft.type;
              Store.persist();
              redraw(false);
            }));
            $$("[data-close]", sheet).forEach(x => x.addEventListener("click", close));
          } else { mount(sheet, close); }
        }
      });
    };
    redraw(false);
  }
};

            : '<div class="sub">No service reminders yet. Add oil changes, chain service, PUC, insurance renewal — anything with a date or an odometer reading.</div>'),

            '<button class="btn btn-sm" data-reminder-task="1">' + icon("tasks", 13) + " Turn a reminder into a task</button>" +
            '<button class="btn btn-sm" data-log-service="' + esc(v.id) + '">' + icon("history", 13) + " Log a service</button>" +
          "</div>",
        "</div>",
      "</div>",

      /* ── service history ── */
      '<div class="card">',
        cardHead("history", "Service history", '<span class="sub">' + (v.history || []).length + " entr" + ((v.history || []).length === 1 ? "y" : "ies") + "</span>"),
        ((v.history || []).length
          ? '<div class="timeline">' + v.history.map(h =>
              '<div class="tl-item evt-add"><div class="tl-t">' + esc(h.label || serviceLabel(h.type)) + " logged</div>" +
              '<div class="tl-d">' + esc(h.notes || "Added to this vehicle's service record.") + (h.km != null ? " · at " + nfmt(h.km) + " km" : "") + (h.cost ? " · " + esc(h.cost) : "") + "</div>" +
              '<div class="tl-w">' + esc(fmtDateTime(h.date)) + " · " + esc(relTime(h.date)) + "</div></div>").join("") + "</div>"
          : '<div class="sub">Nothing logged for this vehicle yet. Completing a reminder, or using “Log a service”, writes a real timestamped entry here.</div>'),
      "</div>",

      '<div style="margin-top:16px">' + UI.notice(st.footerNote, "warn", "warn") + "</div>"
    ].join("");
  },

  afterRender(root, params) {
    bindDeviceInteractions(root);
    const id = params.id;
    const v = Store.getVehicle(id);
    if (!v) return;

    VehicleLive.onChange = changed => {
      if (Router.current !== "vehicle" || Router.params.id !== changed) return;
      VehicleView.paintLive(changed);
    };
    if (Store.data.settings.prefs.keepLiveSnapshot && !VehicleLive.anyValue(id)) VehicleLive.restore(v);

    $$("[data-back]", root).forEach(b => b.addEventListener("click", () => Router.go(b.dataset.back || "vehicles")));
    $$("[data-edit-vehicle]", root).forEach(b => b.addEventListener("click", () => VehicleForm.open(Store.getVehicle(id))));
    $$("[data-connect-vehicle]", root).forEach(b => b.addEventListener("click", () => Integrations.connectFlow(id)));
    $$("[data-add-reminder]", root).forEach(b => b.addEventListener("click", () => ReminderForm.open(id)));
    $$("[data-primary-vehicle]", root).forEach(b => b.addEventListener("click", () => {
      Store.setPrimaryVehicle(id);
      UI.toast("Primary vehicle set", "“" + v.nickname + "” now appears on Home.", "ok");
      UI.refresh();
    }));
    $$("[data-quick-disconnect]", root).forEach(b => b.addEventListener("click", () => {
      UI.confirm({
        title: "Disconnect this vehicle?",
        message: "The live integration is closed and polling stops. Your profile, photo, reminders, insurance and service history are untouched.",
        confirmText: "Disconnect"
      }).then(async ok => {
        if (!ok) return;
        b.disabled = true;
        await Integrations.disconnectVehicle(id);
        UI.toast("Vehicle disconnected", "No live data will be received until you connect again.", "ok");
        UI.refresh();
      });
